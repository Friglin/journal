<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Edgebook</title>
<meta name="theme-color" content="#0071E3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Edgebook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap">
<style>
/* Layout: app a una colonna per telefono – header con cambio file, viste Home / Trade / Analisi / Simula, scheda a comparsa per inserire */
/* Palette: inchiostro blu notte e cobalto, verde/rosso solo per vinti e persi. Titoli e numeri in Sora, testo in Geist. */
:root {
  --seg-on:#FFFFFF;
  --bg:#F5F5F7; --surface:#FFFFFF; --sunk:#ECECEF; --line:rgba(0,0,0,.075); --fg:#1D1D1F; --fg2:#55555B; --fg3:#8A8A90;
  --accent:#0071E3; --accent-ink:#FFFFFF; --accent-soft:#E5F0FD; --glow2:#30B0FF;
  --win:#0E8F55; --win-soft:#DDF3E7; --loss:#E0352B; --loss-soft:#FCE4E2; --warn:#A35A00; --warn-soft:#FDF0D8;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 18px 40px -24px rgba(0,0,0,.22);
  --scrim:rgba(0,0,0,.38);
  --display:-apple-system,'SF Pro Display','Sora','Segoe UI Variable Display',system-ui,sans-serif;
  --sans:-apple-system,'SF Pro Text','Geist','Segoe UI Variable Text',system-ui,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --seg-on:#3A3A40; --bg:#000000; --surface:#141416; --sunk:#222226; --line:rgba(255,255,255,.085); --fg:#F5F5F7; --fg2:#A6A6AD; --fg3:#6E6E75;
  --accent:#2E9BFF; --accent-ink:#FFFFFF; --accent-soft:#0B2742; --glow2:#64D2FF;
  --win:#32D583; --win-soft:#0B2A1C; --loss:#FF6B61; --loss-soft:#3A1412; --warn:#FFB340; --warn-soft:#352407;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 20px 44px -22px rgba(0,0,0,.9); --scrim:rgba(0,0,0,.62); color-scheme:dark; } }
:root[data-theme="dark"] {
  --seg-on:#3A3A40; --bg:#000000; --surface:#141416; --sunk:#222226; --line:rgba(255,255,255,.085); --fg:#F5F5F7; --fg2:#A6A6AD; --fg3:#6E6E75;
  --accent:#2E9BFF; --accent-ink:#FFFFFF; --accent-soft:#0B2742; --glow2:#64D2FF;
  --win:#32D583; --win-soft:#0B2A1C; --loss:#FF6B61; --loss-soft:#3A1412; --warn:#FFB340; --warn-soft:#352407;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 20px 44px -22px rgba(0,0,0,.9); --scrim:rgba(0,0,0,.62); color-scheme:dark; }

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { background:var(--bg); }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 var(--sans); -webkit-font-smoothing:antialiased; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:25; background:var(--bg); }
button { font:inherit; color:inherit; cursor:pointer; }
[hidden] { display:none !important; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.num, .v, .big, td { font-variant-numeric:tabular-nums; }
.wrap { max-width:720px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
.ic { flex:none; display:block; }
.pos { color:var(--win); } .neg { color:var(--loss); } .mut { color:var(--fg3); }
.eyebrow { font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg3); font-weight:600; }
.h2 { font-family:var(--display); font-size:20px; font-weight:500; letter-spacing:-.01em; margin:0; text-wrap:balance; }

/* header */
header.top { position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid transparent; transition:border-color .25s; }
header.top.scrolled { border-bottom-color:var(--line); }
.top .wrap { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:12px; }
.brand { display:flex; align-items:center; gap:9px; font-family:var(--display); font-size:21px; font-weight:500; letter-spacing:-.015em; }
.quiet .rise, .quiet .line, .quiet .area, .quiet .endpt, .quiet .bar, .quiet .track i, .quiet .ring .fgc, .quiet .dots i { animation:none; }
.trow.pend { opacity:.55; pointer-events:none; }
@keyframes spin { to { transform:rotate(360deg); } }

/* segmented */
.seg { position:relative; display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); background:var(--sunk); border-radius:12px; padding:3px; }
.seg::before { content:""; position:absolute; top:3px; bottom:3px; left:3px; width:calc((100% - 6px) / var(--n)); border-radius:9px; background:var(--seg-on);
  box-shadow:0 1px 2px rgba(0,0,0,.08), 0 3px 8px -2px rgba(0,0,0,.18); transform:translateX(calc(var(--i) * 100%)); transition:transform .38s cubic-bezier(.3,1.25,.45,1), opacity .2s; }
.seg.none::before { opacity:0; }
.seg button { position:relative; z-index:1; border:0; background:none; padding:9px 4px; border-radius:9px; font-size:14px; font-weight:500; color:var(--fg2); transition:color .25s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seg button.on { color:var(--fg); font-weight:600; }
.seg.sm button { padding:6px 4px; font-size:13px; }
.seg.file { width:172px; }
.seg button .ic { display:inline-block; vertical-align:-3px; margin-right:4px; }

/* viste */
main { padding-bottom:calc(150px + env(safe-area-inset-bottom,0px)); }
.view { display:flex; flex-direction:column; gap:14px; padding-top:6px; }
.view-in { animation:viewIn .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes viewIn { from { opacity:0; transform:translateY(10px); } }
.rise { animation:rise .65s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--d,0ms); }
@keyframes rise { from { opacity:0; transform:translateY(14px); } }
.card { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; min-width:0; }
.card-h { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
.card-h .sub { font-size:12.5px; color:var(--fg3); }
.link { border:0; background:none; color:var(--accent); font-weight:600; font-size:13.5px; padding:4px 0; display:inline-flex; align-items:center; gap:2px; }

/* home */
.hello { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-top:6px; }
.hello h1 { font-family:var(--display); font-weight:400; font-size:32px; line-height:1.1; letter-spacing:-.025em; margin:4px 0 0; }
.sess { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:500; color:var(--fg2); background:var(--surface); border:1px solid var(--line); padding:5px 10px 5px 9px; border-radius:99px; }
.sess i { width:7px; height:7px; border-radius:50%; background:var(--fg3); }
.sess.open i { background:var(--win); box-shadow:0 0 0 0 color-mix(in srgb,var(--win) 60%,transparent); animation:pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow:0 0 0 7px transparent; } 100% { box-shadow:0 0 0 0 transparent; } }
.hero { position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:18px 18px 0; box-shadow:var(--shadow); }
.hero-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.big { font-family:var(--display); font-size:54px; line-height:1; letter-spacing:-.035em; font-weight:400; margin-top:10px; }
.big small { font-size:22px; color:var(--fg3); letter-spacing:0; margin-left:6px; }
.hero-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; font-size:13px; color:var(--fg2); }
.delta { display:inline-flex; align-items:center; gap:3px; font-size:12.5px; font-weight:600; padding:3px 8px 3px 6px; border-radius:99px; }
.delta.up { background:var(--win-soft); color:var(--win); } .delta.down { background:var(--loss-soft); color:var(--loss); } .delta.flat { background:var(--sunk); color:var(--fg2); }
.spark { position:relative; height:104px; margin:6px -18px 0; }
.kgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.kpi { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:4px; min-width:0; }
.kpi .v { font-family:var(--display); font-size:29px; line-height:1.1; letter-spacing:-.02em; display:flex; align-items:center; gap:8px; }
.kpi .v small { font-size:15px; color:var(--fg3); }
.kpi .h { font-size:12.5px; color:var(--fg2); line-height:1.35; }
.ring { width:34px; height:34px; transform:rotate(-90deg); flex:none; }
.ring circle { fill:none; stroke-width:4.5; }
.ring .bgc { stroke:var(--sunk); } .ring .fgc { stroke:var(--accent); stroke-linecap:round; animation:ring 1.2s cubic-bezier(.3,.8,.3,1) both .15s; }
@keyframes ring { from { stroke-dashoffset:94.25; } }
.dots { display:flex; gap:6px; align-items:center; }
.dots i { width:14px; height:14px; border-radius:50%; background:var(--fg3); animation:pop .4s cubic-bezier(.3,1.5,.5,1) both; animation-delay:var(--d); }
.dots i.w { background:var(--win); } .dots i.l { background:var(--loss); } .dots i.b { background:transparent; border:2px solid var(--fg3); }
@keyframes pop { from { transform:scale(0); } }
.ins { display:flex; flex-direction:column; }
.ins-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:11px 0; border-top:1px solid var(--line); }
.ins-row:first-child { border-top:0; padding-top:0; }
.ins-ic { width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); }
.ins-ic.bad { background:var(--loss-soft); color:var(--loss); }
.ins-row b { display:block; font-weight:600; font-size:14.5px; }
.ins-row span { font-size:12.5px; color:var(--fg2); }
.ins-row .r { font-family:var(--display); font-size:18px; }
.tip-row { display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:start; padding:11px 0; border-top:1px solid var(--line); }
.tip-row:first-child { border-top:0; padding-top:0; }
.tip-row b { display:block; font-weight:600; font-size:14.5px; margin-bottom:2px; } .tip-row span { font-size:13px; color:var(--fg2); line-height:1.45; }
#ai-box { margin-top:14px; display:flex; flex-direction:column; gap:10px; }
.ai-go { width:100%; gap:10px; }
.ai { border-radius:16px; background:var(--sunk); padding:14px; animation:rise .35s both; }
.ai-h { display:flex; align-items:center; gap:10px; margin-bottom:8px; } .ai-h b { flex:1; font-size:14.5px; }
.md h4 { margin:12px 0 4px; font-size:14px; } .md h4:first-child { margin-top:0; }
.md p, .md li { font-size:13.5px; line-height:1.5; color:var(--fg2); margin:4px 0; } .md ul { margin:4px 0; padding-left:18px; } .md b { color:var(--fg); }
.spin.dark { border-color:color-mix(in srgb,var(--accent) 30%,transparent); border-top-color:var(--accent); }

/* elenco */
.toolbar { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:2px 16px; }
.toolbar::-webkit-scrollbar { display:none; }
.chip { flex:none; border:1px solid var(--line); background:var(--surface); padding:7px 13px; border-radius:99px; font-size:13.5px; font-weight:500; color:var(--fg2); transition:background .2s,color .2s,border-color .2s,transform .15s; }
.chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
.chip:active, .btn:active, .trow:active, .fab:active { transform:scale(.97); }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.dayh { display:flex; justify-content:space-between; align-items:baseline; padding:6px 4px 6px; font-size:13px; font-weight:600; color:var(--fg2); }
.dayh .num { font-family:var(--display); font-size:15px; font-weight:500; }
.dayc { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:0 14px; }
.trow { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:12px 0; transition:transform .15s; }
.trow:first-child { border-top:0; }
.badge { position:relative; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-weight:700; font-size:12px; letter-spacing:.03em; background:var(--sunk); color:var(--fg2); }
.badge::after { content:""; position:absolute; right:-3px; top:-3px; width:11px; height:11px; border-radius:50%; border:2.5px solid var(--surface); background:var(--fg3); }
.badge.w::after { background:var(--win); } .badge.l::after { background:var(--loss); }
.t1 { font-weight:600; font-size:14.5px; display:flex; gap:8px; align-items:baseline; }
.t1 span { font-weight:400; color:var(--fg3); font-size:13px; }
.t2 { font-size:12.5px; color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tres { text-align:right; }
.tres b { display:block; font-family:var(--display); font-size:17px; font-weight:500; }
.tres span { font-size:11.5px; color:var(--fg3); }
.trow > .ic { color:var(--fg3); }
.more { align-self:center; }

/* analisi */
.stat-h { display:flex; justify-content:space-between; align-items:center; gap:10px; padding-top:6px; }
.stat-h h1 { font-family:var(--display); font-weight:400; font-size:30px; letter-spacing:-.025em; margin:0; }
.fbtn { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:8px 14px; font-weight:600; font-size:13.5px; }
.fbtn em { font-style:normal; background:var(--accent); color:var(--accent-ink); border-radius:99px; min-width:20px; height:20px; display:grid; place-items:center; font-size:11.5px; padding:0 6px; }
.chart { position:relative; }
.chart svg { display:block; overflow:visible; }
.grid { stroke:var(--line); stroke-width:1; }
.grid.zero { stroke:var(--fg3); stroke-opacity:.6; }
.tick { fill:var(--fg3); font-size:10.5px; font-family:var(--sans); }
.line { fill:none; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; stroke-dasharray:1 1; animation:draw 1.3s cubic-bezier(.45,0,.2,1) both; }
@keyframes draw { from { stroke-dashoffset:1; } }
.area { animation:fade 1s .5s both; }
@keyframes fade { from { opacity:0; } }
.endpt { fill:var(--accent); stroke:var(--surface); stroke-width:2.5; animation:pop .45s 1.2s cubic-bezier(.3,1.6,.5,1) both; transform-box:fill-box; transform-origin:center; }
.xh line { stroke:var(--fg3); stroke-dasharray:3 3; } .xh circle { fill:var(--accent); stroke:var(--surface); stroke-width:2.5; }
.bar { transform-box:fill-box; animation:barIn .7s cubic-bezier(.2,.8,.2,1) both; transition:opacity .2s; }
.bar.p { fill:var(--win); transform-origin:50% 100%; } .bar.n { fill:var(--loss); transform-origin:50% 0; }
.bar.dim { opacity:.35; }
@keyframes barIn { from { transform:scaleY(0); } }
.tip { position:absolute; top:0; left:0; pointer-events:none; background:var(--fg); color:var(--bg); font-size:12px; line-height:1.3; padding:7px 10px; border-radius:10px; white-space:nowrap; opacity:0; transform:translate(-50%,-110%); transition:opacity .15s; z-index:2; }
.tip.show { opacity:1; }
.tip b { display:block; font-size:14px; font-family:var(--display); font-weight:500; }
.bd { display:grid; grid-template-columns:minmax(0,1.9fr) minmax(0,1fr) 40px 60px; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:13.5px; }
.bd.hd { border-top:0; padding:0 0 4px; font-size:11px; color:var(--fg3); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
.bd-l { min-width:0; } .bd-l span { display:block; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .bd-l small { color:var(--fg3); font-size:11.5px; }
.track { height:8px; border-radius:99px; background:var(--sunk); overflow:hidden; }
.track i { display:block; height:100%; border-radius:99px; background:var(--accent); transform-origin:left; animation:grow .9s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--d,0ms); }
@keyframes grow { from { transform:scaleX(0); } }
.bd .p2, .bd .r { text-align:right; } .bd .r { font-family:var(--display); font-size:15px; }
.tbl-wrap { overflow-x:auto; margin:0 -4px; }
table { width:100%; border-collapse:separate; border-spacing:3px; font-size:12.5px; }
th { color:var(--fg3); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:4px; text-align:center; }
td { padding:8px 4px; text-align:center; border-radius:8px; }
td:first-child, th:first-child { text-align:left; font-weight:600; color:var(--fg2); }
td.hm { background:color-mix(in oklab, var(--win) var(--p), var(--sunk)); }
td small { display:block; color:var(--fg2); font-size:10.5px; }
.empty { text-align:center; padding:34px 20px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.empty .h2 { font-size:19px; }
.empty p { margin:0; color:var(--fg2); font-size:14px; max-width:30ch; }
.skel { border-radius:18px; background:linear-gradient(100deg,var(--sunk) 30%,color-mix(in srgb,var(--sunk) 50%,var(--surface)) 50%,var(--sunk) 70%); background-size:300% 100%; animation:shim 1.4s linear infinite; }
@keyframes shim { from { background-position:100% 0; } to { background-position:0 0; } }

/* nav e pulsante nuovo */
nav.bar { position:fixed; left:0; right:0; bottom:0; z-index:30; background:color-mix(in srgb,var(--surface) 92%,transparent); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:max(8px,env(safe-area-inset-left,0px)); padding-right:max(8px,env(safe-area-inset-right,0px)); }
nav.bar .in { position:relative; display:grid; grid-template-columns:repeat(5,1fr); max-width:560px; margin:0 auto; }
nav.bar button { background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0 9px; font-size:11.5px; font-weight:600; color:var(--fg3); transition:color .25s; }
nav.bar .pill { display:grid; place-items:center; width:58px; height:30px; border-radius:99px; transition:background .3s, color .3s; }
nav.bar button { position:relative; z-index:1; }
nav.bar button.on { color:var(--fg); } nav.bar button.on .pill { color:var(--accent); }
.ind { position:absolute; top:8px; width:58px; height:30px; border-radius:99px; background:var(--accent-soft); left:calc(100% / 5 * var(--i,0) + 100% / 10 - 29px); transition:left .5s cubic-bezier(.3,1.3,.45,1); }
.fab { position:fixed; z-index:31; transition:padding .35s, gap .35s, transform .2s, opacity .25s; right:max(16px,calc(env(safe-area-inset-right,0px) + 16px)); bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
  display:flex; align-items:center; gap:8px; height:54px; padding:0 22px 0 17px; border:0; border-radius:18px; background:var(--accent); color:var(--accent-ink);
  font-weight:600; font-size:15px; box-shadow:0 12px 26px -10px color-mix(in srgb,var(--accent) 75%,transparent); transition:transform .2s, opacity .25s; }
.fab.hide { opacity:0; transform:scale(.8); pointer-events:none; }

/* scheda */
.scrim { position:fixed; inset:0; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .35s; z-index:40; }
.scrim.open { opacity:1; pointer-events:auto; }
.sheet { position:fixed; left:0; right:0; bottom:0; top:calc(env(safe-area-inset-top,0px) + 12px); z-index:41; max-width:720px; margin:0 auto; background:var(--bg);
  border-radius:26px 26px 0 0; display:flex; flex-direction:column; transform:translateY(103%); transition:transform .5s cubic-bezier(.2,.9,.15,1); box-shadow:0 -24px 50px -24px rgba(0,0,0,.4); }
.sheet.open { transform:none; }
.grab { width:40px; height:5px; border-radius:9px; background:var(--line); margin:8px auto 0; flex:none; }
.sheet-h { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px)); flex:none; }
.sheet-h h2 { font-family:var(--display); font-weight:400; font-size:26px; letter-spacing:-.02em; margin:2px 0 0; }
.icon-btn { width:38px; height:38px; border-radius:50%; border:0; background:var(--sunk); display:grid; place-items:center; color:var(--fg2); flex:none; }

  return fetch(url, { method:'POST', body: JSON.stringify({ key, fn, args }), signal: ctl ? ctl.signal : undefined })
    .catch(() => { throw new Error('NETWORK'); })

  const W=c.width=innerWidth*dpr, H=c.height=innerHeight*dpr, ctx=c.getContext('2d'), cs=getComputedStyle(document.documentElement);
  const cols=['--accent','--win','--glow2','--warn'].map(v=>cs.getPropertyValue(v).trim()||'#888');
  const P=Array.from({ length:90 }, ()=>({ x:W*(.3+Math.random()*.4), y:H*.42, vx:(Math.random()-.5)*16*dpr, vy:-(9+Math.random()*16)*dpr, w:(4+Math.random()*4)*dpr, h:(7+Math.random()*8)*dpr,

function periodRange(per, back) { // back=1: periodo precedente
  const now=new Date(); let a,b;
  if (per==='w') { const mon=addDays(now, -((now.getDay()+6)%7)); a=addDays(mon, -7*(back+wkOff())); b=addDays(a, 7); }
  else if (per==='c') { const f=pdIso(S.cust.from), t=pdIso(S.cust.to); if (!f || !t || t<f) return back ? null : [new Date(2000,0,1), new Date(2100,0,1)];
    const len=Math.round((t-f)/dayMs)+1; a=addDays(f, -len*back); b=addDays(a, len); }
  else if (per==='m') { a=new Date(now.getFullYear(), now.getMonth()-back, 1); b=new Date(now.getFullYear(), now.getMonth()-back+1, 1); }
  else if (per==='3m') { a=new Date(now.getFullYear(), now.getMonth()-2-3*back, 1); b=new Date(now.getFullYear(), now.getMonth()+1-3*back, 1); }
  else if (per==='y') { a=new Date(now.getFullYear()-back,0,1); b=new Date(now.getFullYear()-back+1,0,1); }
  else return back ? null : [new Date(2000,0,1), new Date(2100,0,1)];

}

  if (have) { S.data[f]=have; applyData(have); renderCurrent(); } else { S.loaded=false; renderCurrent(); }
  const before = have ? JSON.stringify(have) : '';

}

function sessionInfo() {
  const it = new Date(new Date().toLocaleString('en-US',{ timeZone:'Europe/Rome' })), m=it.getHours()*60+it.getMinutes(), wd=it.getDay();
  const fm = x => (x>=60 ? Math.floor(x/60)+' h ' : '')+String(x%60).padStart(x>=60?2:1,'0')+' min';
  if (wd>=1 && wd<=5 && m>=SESS[0] && m<SESS[1]) return { open:true, txt:'Sessione aperta · chiude tra '+fm(SESS[1]-m) };
  if (wd>=1 && wd<=5 && m<SESS[0]) return { open:false, txt:'La sessione inizia tra '+fm(SESS[0]-m) };
  let add=1; while ([0,6].includes((wd+add)%7)) add++;
  return { open:false, txt: add===1 ? 'Sessione domani alle '+CFG.s0 : 'Prossima sessione '+GIORNI[(wd+add)%7]+' alle '+CFG.s0 };
}

function loadFJ(force) {
  if (fjP) return fjP;
  if (!force && S.fj && Date.now()-S.fj.got < 110000) return Promise.resolve(S.fj);
  if (!force && Date.now()-fjTry < 60000 && fjErr) return Promise.reject(new Error(fjErr));
  fjTry=Date.now();
  fjP = call('fjNews').then(d=>{ d.got=Date.now(); S.fj=d; fjErr=''; return d; })
    .catch(e=>{ fjErr = /Funzione sconosciuta/.test(e.message||'') ? 'OLD' : (e.message||String(e)); throw e; })
    .finally(()=>{ fjP=null; if (S.tab==='news' && !S.sheet) renderCurrent(true); });
  return fjP;
}

// Disciplina: le regole del piano, una per riga, con quante volte le hai rispettate questo mese
function discCard() {
  const J=rowsOf('Journal')||[], now=new Date(), m0=new Date(now.getFullYear(),now.getMonth(),1), jm=J.filter(t=>t.d>=m0);
  let h='<div class="card disc"><div class="card-h"><h2 class="h2">Disciplina</h2><span class="sub">Journal · '+MESI_F[now.getMonth()]+'</span></div>';
  if (!jm.length) return h+'<div class="empty-row">Nessun trade reale questo mese.</div></div>';
  const rr=t=>isFinite(t.rr)?t.rr:0, lim=num(CFG.lossR), days={};
  jm.forEach(t=>{ const k=iso(t.d); (days[k]=days[k]||[]).push(t); });
  const D=Object.entries(days).map(([k,g])=>{ const afterTP=g.some((t,i)=>i>0 && g.slice(0,i).some(x=>x.out==='Win'||rr(x)>0)), R=g.reduce((s,t)=>s+rr(t),0);
    const errs=g.filter(t=>t.exe==='Errore');
    return { k, n:g.length, max2:g.length<=2, tp:!afterTP, loss:!(isFinite(lim)&&lim>0) || R>-lim-1e-9, valid:!errs.length, hadWin:g.some(x=>x.out==='Win'||rr(x)>0) }; });
  D.forEach(d=>{ d.ok = d.max2 && d.tp && d.loss && d.valid; });
  const okN=D.filter(d=>d.ok).length; let run=0; for (let i=D.length-1;i>=0 && D[i].ok;i--) run++;
  const rule=(lbl,ok,tot,bad,hint)=>{ const all=ok===tot; return '<div class="rule '+(all?'ok':'ko')+'">'+ic(all?'check':'alert',16,2.2)+'<div><b>'+lbl+'</b><span>'+(tot?ok+' su '+tot+' '+hint:'nessun caso questo mese')+(bad.length?' · non rispettata: '+bad.map(dayShort).join(', '):'')+'</span></div></div>'; };
  const tr=jm.filter(t=>t.exe), val=tr.filter(t=>t.exe==='Trade valido'), er=tr.filter(t=>t.exe==='Errore');
  h+='<div class="ds-lead"><b class="num">'+okN+' su '+D.length+'</b><span>giornate in regola</span></div><div class="ds-bar"><i style="width:'+(100*okN/D.length)+'%"></i></div>'+
    '<p class="ds-note">'+(okN===D.length?'Ogni giornata di trading di questo mese ha rispettato tutte le regole.':'Una giornata è in regola quando rispetta tutte le regole qui sotto.')+(run>1?' Sei a <b>'+run+' giornate in regola di fila</b>.':'')+'</p>'+
    '<div class="rules">'+
    rule('Solo trade validi', D.filter(d=>d.valid).length, D.length, D.filter(d=>!d.valid).map(d=>d.k), 'giornate senza errori')+
    rule('Massimo 2 trade al giorno', D.filter(d=>d.max2).length, D.length, D.filter(d=>!d.max2).map(d=>d.k), 'giornate')+
    rule('Stop dopo il TP', D.filter(d=>d.hadWin && d.tp).length, D.filter(d=>d.hadWin).length, D.filter(d=>d.hadWin && !d.tp).map(d=>d.k), 'giornate con un TP')+
    (isFinite(lim)&&lim>0 ? rule('Perdita massima −'+fmtN(lim,1)+' R al giorno', D.filter(d=>d.loss).length, D.length, D.filter(d=>!d.loss).map(d=>d.k), 'giornate') : '')+'</div>';
  if (val.length && er.length) { const av=a=>a.reduce((s,t)=>s+rr(t),0)/a.length, dv=av(val)-av(er);
    h+='<div class="ds-cost"><div><span>Trade valido</span><b class="'+sgn(av(val))+' num">'+fmtN(av(val),2,true)+' R</b><em>in media · '+val.length+' trade</em></div><div><span>Trade con errori</span><b class="'+sgn(av(er))+' num">'+fmtN(av(er),2,true)+' R</b><em>in media · '+er.length+' trade</em></div></div>'+
      '<p class="ds-note">'+(dv>0?'Ogni errore ti costa in media <b>'+fmtN(dv,2)+' R</b> rispetto a un trade fatto bene.':'Questo mese i trade con errori sono andati bene lo stesso: è fortuna, non un motivo per ripeterli.')+'</p>'; }
  if (er.length) { const cnt={}; er.forEach(t=>(t.errs.length?t.errs:['Non specificato']).forEach(x=>cnt[x]=(cnt[x]||0)+1));
    h+='<div class="ds-errs">'+Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k,n])=>'<span class="echip">'+esc(k)+' <b>'+n+'</b></span>').join('')+'</div>'; }
  return h+'</div>';
}

// ───────────────────────── COACH (consigli dal periodo filtrato) ─────────────────────────
// Ogni gruppo (idea, fascia, giorno…) è giudicato sulla resa media per trade in R, «corretta» per il numero di trade:
// con pochi trade il valore viene avvicinato alla media generale (k=5), così 3 su 3 non vale come 30 su 40.
// «Forte» se anche il caso pessimo (80% di fiducia) è sopra zero, «da evitare» se anche il caso migliore è sotto zero.
const COACH_K = 5, COACH_Z = 1.28;
function rStats(rs) { const n=rs.length; if (!n) return { n:0 }; const mean=rs.reduce((x,y)=>x+y,0)/n;
  const sd = n>1 ? Math.sqrt(rs.reduce((s,r)=>s+(r-mean)*(r-mean),0)/(n-1)) : 0, se = n>1 ? sd/Math.sqrt(n) : Infinity;
  return { n, mean, lo:mean-COACH_Z*se, hi:mean+COACH_Z*se, sum:mean*n }; }
function coachGroups(ts, m, keyFn, keys, overall) {
  return keys.map(k=>{ const g=ts.filter(t=>keyFn(t)===k); if (g.length<3) return null; const st=rStats(g.map(m.rOf)), a=agg(g,m);
    const shr=(st.sum+COACH_K*overall)/(st.n+COACH_K);
    return { k, n:st.n, wr:a.wr, R:st.sum, exp:st.mean, shr, lo:st.lo, hi:st.hi, verdict: st.n>=5 && st.lo>0 ? 'forte' : st.n>=5 && st.hi<0 ? 'evitare' : 'neutro' }; })
    .filter(Boolean).sort((a,b)=>b.shr-a.shr);
}
function coachData(scope) {
  const E=S.type==='EOW', T=tgt(), m=curModel(), allSc=(scope||S.coachScope)==='all', ts=allSc ? all() : filtered(m); if (ts.length<5) return null;
  const all0=rStats(ts.map(m.rOf)), overall=all0.mean, a=agg(ts,m);
  const dims=[['Idea 5m',t=>t.idea,L.idea],['Fascia oraria',bandOf,L.bands.map(b=>b[0])],['Giorno',t=>t.day,L.days],['News',t=>t.news,L.news],
    ['SMT',t=>t.smt,L.smt],['Coming from LVN',t=>t.lvn==='Si'?'Da LVN':t.lvn==='No'?'Non da LVN':'',['Da LVN','Non da LVN']],
    ['Struttura 1m',t=>t.clean?'1m pulito':'1m non pulito',['1m pulito','1m non pulito']],['Asset',t=>t.a,L.asset]];
  if (hasCol('Direzione')) dims.push(['Direzione',t=>t.dir,['Long','Short']]);
  if (E && hasCol('2° CC')) dims.push(['2° CC',t=>t.cc2?'Con 2° CC':'Senza 2° CC',['Con 2° CC','Senza 2° CC']]);
  const groups={}; dims.forEach(([name,fn,keys])=>{ const g=coachGroups(ts,m,fn,keys,overall); if (g.length) groups[name]=g; });
  let targets=null;
  if (E) targets=[1,2,3,4,5].map(k=>{ const mm=model(k), st=rStats(ts.map(mm.rOf)); return { T:k, wr:ts.filter(mm.isWin).length/ts.length, exp:st.mean, lo:st.lo }; });
  const best = targets ? targets.slice().sort((x,y)=>y.lo-x.lo)[0] : null;
  const recentN=Math.min(20, Math.floor(ts.length/2)), rec = recentN>=5 ? rStats(ts.slice(-recentN).map(m.rOf)) : null;
  const dayNews=[]; L.days.forEach(d=>L.news.forEach(nw=>{ const g=ts.filter(t=>t.day===d && t.news===nw); if (g.length>=3) { const st=rStats(g.map(m.rOf)); dayNews.push({ day:d, news:nw, n:st.n, exp:st.mean, shr:(st.sum+COACH_K*overall)/(st.n+COACH_K) }); } }));
  let disc=null;
  if (!E && hasCol('Esecuzione')) { const ok=ts.filter(t=>t.exe==='Trade valido'), ko=ts.filter(t=>t.exe==='Errore'); if (ok.length+ko.length) {
    const errs={}; ko.forEach(t=>(t.errs||[]).forEach(e=>{ (errs[e]=errs[e]||{n:0,R:0}); errs[e].n++; errs[e].R+=m.rOf(t); }));
    disc={ valid:ok.length, errors:ko.length, R_valid:ok.reduce((s,t)=>s+m.rOf(t),0), R_errors:ko.reduce((s,t)=>s+m.rOf(t),0), byError:errs }; } }
  const F=S.filt, d0=ts[0].d, d1=ts[ts.length-1].d;
  return { file:S.file, esito: E?'EOW: vinto '+T+'R se il trade arriva a '+T+'R prima dello stop, altrimenti −1R':'Journal: RR reale del trade',
    periodo: d0.getDate()+' '+MESI[d0.getMonth()]+' '+d0.getFullYear()+' → '+d1.getDate()+' '+MESI[d1.getMonth()]+' '+d1.getFullYear(),
    filtri: allSc ? ['nessuno: tutti i trade del file'] : activeFilters().map(x=>x.l), trade:ts.length, winrate:a.wr, R_totali:a.R, expectancy:overall, profit_factor:isFinite(a.pf)?a.pf:null, max_drawdown_R:a.dd,
    target_attuale: E?T:null, targets, target_consigliato: best && best.T, forma_recente: rec && { ultimi:recentN, expectancy:rec.mean, storico:overall },
    gruppi: groups, giorno_news: dayNews.sort((x,y)=>y.shr-x.shr), disciplina: disc,
    oggi: GIORNI[new Date().getDay()]+' '+new Date().getDate()+' '+MESI_F[new Date().getMonth()] };
}
const fR = x => fmtR(x,2);
function coachCard(cd) {
  if (!cd) return card('Coach', '', '<p class="mut" style="margin:0">Servono almeno 5 trade con questi filtri per dare consigli.</p>', 240);
  const E=S.type==='EOW', tips=[];
  if (E && cd.targets) { const b=cd.targets.find(t=>t.T===cd.target_consigliato), cur=cd.targets.find(t=>t.T===cd.target_attuale);
    tips.push({ i:'target', c:'', h:'Target consigliato: '+b.T+'R', p: b.T===cd.target_attuale ? 'È quello che stai già usando: resa media '+fR(b.exp)+' per trade (WR '+pct(b.wr)+').'
      : 'Resa media '+fR(b.exp)+' per trade (WR '+pct(b.wr)+'), contro '+fR(cur.exp)+' a '+cur.T+'R. È il target che regge meglio anche nel caso pessimo.' }); }
  const allG=[]; Object.entries(cd.gruppi).forEach(([dim,gs])=>gs.forEach(g=>allG.push(Object.assign({ dim }, g))));
  const strong=allG.filter(g=>g.verdict==='forte').sort((a,b)=>b.shr-a.shr).slice(0,3), avoid=allG.filter(g=>g.verdict==='evitare').sort((a,b)=>a.shr-b.shr).slice(0,3);
  strong.forEach(g=>tips.push({ i:'trendUp', c:'pos', h:g.dim+': '+g.k, p:fR(g.exp)+' per trade su '+g.n+' trade (WR '+pct(g.wr)+'): positivo anche nel caso pessimo.' }));
  avoid.forEach(g=>tips.push({ i:'alert', c:'neg', h:'Da evitare · '+g.dim+': '+g.k, p:fR(g.exp)+' per trade su '+g.n+' trade (WR '+pct(g.wr)+'): negativo anche nel caso migliore.' }));
  if (!strong.length && !avoid.length) { const top=allG.filter(g=>g.n>=5)[0]; if (top) tips.push({ i:'target', c:'', h:'Il più promettente: '+top.dim+' '+top.k, p:fR(top.exp)+' per trade su '+top.n+' trade. Non ancora abbastanza trade per esserne sicuri.' }); }
  if (cd.forma_recente) { const f=cd.forma_recente, dv=f.expectancy-f.storico;
    tips.push({ i:dv>=0?'trendUp':'trendDn', c:dv>=0?'pos':'neg', h:'Forma recente: '+(Math.abs(dv)<0.1?'in linea':dv>0?'meglio del solito':'peggio del solito'), p:'Ultimi '+f.ultimi+' trade: '+fR(f.expectancy)+' per trade, contro '+fR(f.storico)+' del periodo.' }); }
  const dn=cd.giorno_news; if (dn.length>=2) { const b=dn[0], w=dn[dn.length-1];
    tips.push({ i:'clock', c:'', h:'Prossimi giorni', p:'Meglio: '+b.day+' con '+b.news+' ('+fR(b.exp)+' su '+b.n+'). '+(w.exp<0?'Più difficile: '+w.day+' con '+w.news+' ('+fR(w.exp)+' su '+w.n+').':'') }); }
  if (cd.disciplina) { const d=cd.disciplina, tot=d.valid+d.errors;
    tips.push({ i:'check', c:d.R_errors<0?'neg':'', h:'Disciplina: '+pct(d.valid/tot)+' di trade validi', p:'Validi '+fR(d.valid?d.R_valid/d.valid:NaN)+' per trade, con errori '+fR(d.errors?d.R_errors/d.errors:NaN)+' ('+d.errors+' trade). '+(d.errors?'I più costosi: '+Object.entries(d.byError).sort((a,b)=>a[1].R-b[1].R).slice(0,2).map(([k,v])=>k+' '+v.n+'× ('+fmtR(v.R,1)+')').join(', ')+'.':'') }); }
  const body='<div class="tips">'+tips.map(t=>'<div class="tip-row"><div class="ins-ic'+(t.c==='neg'?' bad':'')+'">'+ic(t.i,18)+'</div><div><b class="'+t.c+'">'+esc(t.h)+'</b><span>'+esc(t.p)+'</span></div></div>').join('')+'</div>'+
    '<div id="ai-box">'+aiBox()+'</div>';
  return card('Consigli', cd.trade+' trade · '+cd.periodo, body, 240);
}

function md(s) { // Markdown minimo: titoli ##, elenchi -, grassetto **
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let h='', list=false;
  String(s).split('\n').forEach(l=>{ const t=l.trim();
    if (/^[-•*] /.test(t)) { if (!list) { h+='<ul>'; list=true; } h+='<li>'+inl(t.replace(/^[-•*] /,''))+'</li>'; return; }
    if (list) { h+='</ul>'; list=false; }
    if (/^#{1,4} /.test(t)) h+='<h4>'+inl(t.replace(/^#{1,4} /,''))+'</h4>'; else if (t) h+='<p>'+inl(t)+'</p>'; });
  return h+(list?'</ul>':'');
}

function simulate(Rs, p) {
  const N=p.n, M=p.sims, K=Rs.length, W=N+1, eq=new Float64Array(M*W), fin=new Float64Array(M), ddP=new Float64Array(M), stk=new Int32Array(M);
  let ruined=0, prof=0, ruinT=[];
  for (let s=0;s<M;s++) {
    let e=p.cap, pk=e, mddp=0, st=0, mst=0, hit=false; eq[s*W]=e;
    for (let t=0;t<N;t++) {
      const r=Rs[(Math.random()*K)|0], risk = p.mode==='pct' ? Math.max(0,e)*p.risk/100 : p.risk;
      e += risk*r - p.comm; if (e>pk) pk=e;
      const dp = pk>0 ? (pk-e)/pk : 1; if (dp>mddp) mddp=dp;
      if (r<0) { st++; if (st>mst) mst=st; } else st=0;
      if (!hit && dp*100>=p.ruin) { hit=true; ruinT.push(t+1); }
      eq[s*W+t+1]=e;
    }
    fin[s]=e; ddP[s]=mddp; stk[s]=mst; if (hit) ruined++; if (e>p.cap) prof++;
  }
  const q=(arr,p)=>{ const a=Float64Array.from(arr).sort(); return a[Math.min(a.length-1, Math.max(0, Math.round(p*(a.length-1))))]; };
  // percentili della curva (al massimo ~160 punti per il grafico)
  const step=Math.max(1, Math.ceil(N/160)), band=[], col=new Float64Array(M);
  for (let t=0;t<=N;t+=step) { for (let s=0;s<M;s++) col[s]=eq[s*W+t]; col.sort(); const g=x=>col[Math.round(x*(M-1))];
    band.push({ t, p5:g(.05), p25:g(.25), p50:g(.5), p75:g(.75), p95:g(.95) }); if (t+step>N && t!==N) t=N-step; }
  const paths=[]; for (let k=0;k<Math.min(24,M);k++) { const s=Math.floor(k*M/Math.min(24,M)), pts=[]; for (let t=0;t<=N;t+=step) pts.push(eq[s*W+Math.min(t,N)]); if (pts.length<band.length) pts.push(eq[s*W+N]); paths.push(pts); }
  return { p, band, paths, fin:Array.from(fin), q50:q(fin,.5), q5:q(fin,.05), q95:q(fin,.95), prof:prof/M, ruin:ruined/M,
    dd50:q(ddP,.5), dd95:q(ddP,.95), st50:q(stk,.5), st95:q(stk,.95), ruinT: ruinT.length ? q(ruinT,.5) : NaN, K:Rs.length,
    expR: Rs.reduce((x,y)=>x+y,0)/Rs.length };
}

function fanChart(el, res) {

  const yc=y(p.cap), yr=y(p.cap*(1-p.ruin/100));
  g+='<line class="grid zero" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+yc+'" y2="'+yc+'"/>';
  g+='<line class="ruinl" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+yr+'" y2="'+yr+'"/><text class="tick ruint" x="'+(W-padR)+'" y="'+(yr-5)+'" text-anchor="end">−'+fmtN(p.ruin,0)+'% dal capitale</text>';

  el.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ventaglio delle curve del conto simulate">'+g+'<g class="xh" opacity="0"><line y1="'+padT+'" y2="'+(H-padB)+'"/><circle r="5"/></g></svg><div class="tip"></div>';
  const svg=el.querySelector('svg'), xh=el.querySelector('.xh'), tip=el.querySelector('.tip');

  const o=mins(f.Ora), h={};
  if (E) { for (let k=1;k<=5;k++){ const t=mins(f['t'+k]); if (k<=best && isFinite(t) && isFinite(o) && t>=o) h[k]=hhmm(holdMin(t-o)); } }
  const ox=mins(f.Uscita), hold = !E && isFinite(o) && isFinite(ox) && ox>o ? hhmm(holdMin(ox-o)) : '';
  if (isFinite(o) && (o<930 || o>1110)) w.push('Ora fuori dalla sessione 15:30–18:30.');
  if (E && out==='Win' && isFinite(dd) && isFinite(sl) && dd>=sl) w.push('SL DD ≥ SL ma l\'esito è Win: controlla.');
  const dup = S.rows.find(r => r.Asset===f.Asset && r.Data===fmtIt(f.Data) && String(r.Ora).slice(0,5)===String(f.Ora||'').slice(0,5) && (!S.edit || r._row!==S.edit.row));
  if (dup) w.push('Esiste già un trade '+f.Asset+' con stessa data e ora (riga '+dup._row+').');
  return { sl, dd, max, rr, best, bestLbl, out, h, hold, warn:w };

  return e;
}

  el=document.createElement('div'); el.id='lb'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true');
  el.innerHTML='<div class="lb-top"><button type="button" class="lb-b" data-lbx="prev" aria-label="Precedente">'+ic('chev',16,2.4).replace('<svg','<svg style="transform:rotate(180deg)"')+'</button><b id="lb-t"></b>'+
    '<button type="button" class="lb-b" data-lbx="next" aria-label="Successivo">'+ic('chev',16,2.4)+'</button><a class="lb-b" id="lb-o" target="_blank" rel="noopener">TradingView</a>'+
    '<button type="button" class="lb-b" data-lbx="close" aria-label="Chiudi">'+ic('x',18,2.4)+'</button></div><div class="lb-v" id="lb-v"><img id="lb-i" alt="Screenshot TradingView" draggable="false"></div>'+
    '<div class="lb-hint" id="lb-h"></div>';
  document.body.appendChild(el);
  el.addEventListener('click', e => { const b=e.target.closest('[data-lbx]'); if (!b) return; const a=b.dataset.lbx; if (a==='close') lbClose(); else lbShow(LB.i+(a==='next'?1:-1)); });
  const v=$('lb-v'), img=$('lb-i');
  img.addEventListener('load', lbFit);
  v.addEventListener('wheel', e => { e.preventDefault(); lbZoom(LB.s*Math.exp(-e.deltaY*0.0018), e.clientX, e.clientY); }, {passive:false});
  v.addEventListener('pointerdown', e => { v.setPointerCapture(e.pointerId); LB.pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); LB.last=null; LB.moved=false; });
  v.addEventListener('pointermove', e => { if (!LB.pts.has(e.pointerId)) return; const pr=LB.pts.get(e.pointerId); LB.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if (LB.pts.size===2) { const [a,b]=[...LB.pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
      if (LB.last) { LB.x+=cx-LB.last.cx; LB.y+=cy-LB.last.cy; lbZoom(LB.s*d/LB.last.d, cx, cy); } LB.last={d,cx,cy}; LB.moved=true; }
    else if (LB.pts.size===1) { const dx=e.clientX-pr.x, dy=e.clientY-pr.y; if (Math.abs(dx)+Math.abs(dy)>2) LB.moved=true; if (LB.s>LB.fit*1.01) { LB.x+=dx; LB.y+=dy; lbApply(); } } });
  const up = e => { const was=LB.pts.size; LB.pts.delete(e.pointerId); LB.last=null;
    if (was===1 && !LB.moved) { const now=Date.now(); if (now-LB.tap<320) { LB.tap=0; lbZoom(LB.s>LB.fit*1.05?LB.fit:LB.fit*2.5, e.clientX, e.clientY); } else LB.tap=now; }
    if (LB.s<LB.fit) lbFit(); };
  v.addEventListener('pointerup', up); v.addEventListener('pointercancel', up);
  return el; }
function lbOpen(list,i) { if (!list.length) return; LB.list=list; lbEl(); $('lb').classList.add('on'); lbShow(i); }
function lbShow(i) { const n=LB.list.length; LB.i=(i+n)%n; const it=LB.list[LB.i], img=$('lb-i');
  $('lb-t').textContent=it.t+(n>1?'  ·  '+(LB.i+1)+'/'+n:''); $('lb-o').href=it.l;
  document.querySelectorAll('#lb [data-lbx=prev],#lb [data-lbx=next]').forEach(b=>b.hidden=n<2);
  $('lb-h').textContent=matchMedia('(hover:hover)').matches?'Rotella per lo zoom · trascina per spostare · doppio clic per ingrandire · Esc per chiudere':'Pizzica per lo zoom · trascina per spostare · doppio tocco per ingrandire';
  img.style.opacity='0'; img.src=it.u; if (img.complete && img.naturalWidth) lbFit(); }
function lbFit() { const v=$('lb-v'), img=$('lb-i'); if (!img.naturalWidth) return; const W=v.clientWidth, H=v.clientHeight;
  LB.fit=Math.min(W/img.naturalWidth, H/img.naturalHeight); LB.s=LB.fit; LB.x=(W-img.naturalWidth*LB.s)/2; LB.y=(H-img.naturalHeight*LB.s)/2; lbApply(); img.style.opacity='1'; }
function lbZoom(ns,cx,cy) { if (!$('lb-i').naturalWidth) return; const r=$('lb-v').getBoundingClientRect(); ns=Math.max(LB.fit*0.9, Math.min(LB.fit*8, ns)); const px=cx-r.left, py=cy-r.top;
  LB.x=px-(px-LB.x)*ns/LB.s; LB.y=py-(py-LB.y)*ns/LB.s; LB.s=ns; lbApply(); }
function lbApply() { const img=$('lb-i'), v=$('lb-v'); const W=v.clientWidth, H=v.clientHeight, w=img.naturalWidth*LB.s, h=img.naturalHeight*LB.s;
  LB.x = w<=W ? (W-w)/2 : Math.min(0, Math.max(W-w, LB.x)); LB.y = h<=H ? (H-h)/2 : Math.min(0, Math.max(H-h, LB.y));
  img.style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')'; v.classList.toggle('z', LB.s>LB.fit*1.01); }
function lbClose() { const el=$('lb'); if (el) el.classList.remove('on'); LB.pts.clear(); }
window.addEventListener('resize', () => { const el=$('lb'); if (el && el.classList.contains('on')) lbFit(); });

async function save() {
  const f=S.f, c=compute(), E=S.type==='EOW';
  const errs=validate(c);
  if (errs.length) {
    S.tried=true; refresh();
    const first=$('sh-body').querySelector('.field.bad');
    if (first) { first.scrollIntoView({ behavior:'smooth', block:'center' }); first.classList.remove('shake'); void first.offsetWidth; first.classList.add('shake');
      const inp=first.querySelector('input,textarea'); if (inp && !inp.value) setTimeout(()=>inp.focus({ preventScroll:true }), 350); }
    toast(errs.length===1 ? 'Sistema il campo in rosso: '+errs[0].m : errs.length+' campi da sistemare, sono segnati in rosso', true); return;
  }
  const d = { 'Asset':f.Asset, 'Direzione':f.Dir||'', 'Data':f.Data, 'Ora':f.Ora, 'Outcome':c.out, 'EM':EM1, '5m Idea':f.Idea, 'News':f.News||'',
              'Coming from LVN':f.LVN||'', 'SMT':f.SMT||'', 'SL DD':isFinite(c.dd)?c.dd:'', '1m Clean STR':!!f.clean,
              'Best Real RR':c.bestLbl, 'Max Real RR':c.max };
  if (E) { d['SL Points']=c.sl; for (let k=1;k<=5;k++) d['Holding time '+k+'rr']=c.h[k]||''; d['Candele PB']=f.PB||''; if (hasCol('2° CC')) d['2° CC']=f.CC2==='Si'?'Si':''; }
  else { d['SL']=c.sl; d['RR']=c.rr; d['TP']=c.rr>0?(f.TP||''):''; d['Holding time']=c.hold;
    if (hasCol('Esecuzione')) { d['Esecuzione']=f.Esecuzione||''; d['Errori']=f.Esecuzione==='Errore'?(f.Errori||[]).join(', '):''; } }
  d['5m Link']=f.L5||''; d['1m Link']=f.L1||''; d['Note']=f.Note||'';
  // la riga compare subito; il foglio viene aggiornato in background
  const file=S.file, edit=S.edit, form=S.f, prov=Object.assign({}, d, { _row: edit?edit.row:null, _pending:true, Data:fmtIt(d.Data) });
  const idx = edit ? S.rows.findIndex(r=>r._row===edit.row) : -1, prev = idx>=0 ? S.rows[idx] : null;
  if (idx>=0) S.rows[idx]=prov; else S.rows.push(prov); touchRows();
  S.flash=prov; S.flashT=performance.now(); closeSheet(); S.edit=null; S.f={}; renderCurrent(true); setSync(true);
  if (c.out==='Win' && !edit) setTimeout(confetti, 260);
  try {
    const res = edit ? await call('updateTrade', file, edit.row, d, edit.check) : await call('addTrade', file, d);
    const D=S.data[file];
    if (D) { const k=D.rows.findIndex(a=>a[0]===res.row[0]); if (k>=0) D.rows[k]=res.row; else D.rows.push(res.row); cacheSet(file,D); }
    if (S.file===file) { const i2=S.rows.indexOf(prov), obj=D?unpack(D.h,res.row):Object.assign({}, prov, { _row:res.row[0], _pending:false });
      if (i2>=0) { S.rows[i2]=obj; touchRows(); } if (S.flash===prov) S.flash=obj; if (!S.sheet) renderCurrent(true); }

    const i2=S.rows.indexOf(prov); if (i2>=0) { if (prev) S.rows[i2]=prev; else S.rows.splice(i2,1); touchRows(); }

    toast('Non salvato: '+(e.message||e), true);
  } finally { setSync(false); }
}

  if (b.dataset.newf) { switchFile(b.dataset.newf); openForm(); return; }
