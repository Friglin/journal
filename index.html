<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edgebook</title>
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Edgebook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap">
<style>
/* Layout: app a una colonna per telefono – header con cambio file, viste Home / Trade / Analisi / Simula, scheda a comparsa per inserire */
/* Palette: inchiostro blu notte e cobalto, verde/rosso solo per vinti e persi. Titoli e numeri in Sora, testo in Geist. */
:root {
  --seg-on:#FFFFFF;
  --bg:#F5F5F7; --surface:#FFFFFF; --sunk:#ECECEF; --line:rgba(0,0,0,.075); --fg:#1D1D1F; --fg2:#55555B; --fg3:#8A8A90;
  --accent:#0071E3; --accent-ink:#FFFFFF; --accent-soft:#E5F0FD; --glow2:#30B0FF;
  --win:#0E8F55; --win-soft:#DDF3E7; --loss:#E0352B; --loss-soft:#FCE4E2; --warn:#A35A00; --warn-soft:#FDF0D8;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 18px 40px -24px rgba(0,0,0,.22);
  --scrim:rgba(0,0,0,.38);
  --display:-apple-system,'SF Pro Display','Sora','Segoe UI Variable Display',system-ui,sans-serif;
  --sans:-apple-system,'SF Pro Text','Geist','Segoe UI Variable Text',system-ui,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --seg-on:#3A3A40; --bg:#000000; --surface:#141416; --sunk:#222226; --line:rgba(255,255,255,.085); --fg:#F5F5F7; --fg2:#A6A6AD; --fg3:#6E6E75;
  --accent:#2E9BFF; --accent-ink:#FFFFFF; --accent-soft:#0B2742; --glow2:#64D2FF;
  --win:#32D583; --win-soft:#0B2A1C; --loss:#FF6B61; --loss-soft:#3A1412; --warn:#FFB340; --warn-soft:#352407;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 20px 44px -22px rgba(0,0,0,.9); --scrim:rgba(0,0,0,.62); color-scheme:dark; } }
:root[data-theme="dark"] {
  --seg-on:#3A3A40; --bg:#000000; --surface:#141416; --sunk:#222226; --line:rgba(255,255,255,.085); --fg:#F5F5F7; --fg2:#A6A6AD; --fg3:#6E6E75;
  --accent:#2E9BFF; --accent-ink:#FFFFFF; --accent-soft:#0B2742; --glow2:#64D2FF;
  --win:#32D583; --win-soft:#0B2A1C; --loss:#FF6B61; --loss-soft:#3A1412; --warn:#FFB340; --warn-soft:#352407;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 20px 44px -22px rgba(0,0,0,.9); --scrim:rgba(0,0,0,.62); color-scheme:dark; }

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { background:var(--bg); }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 var(--sans); -webkit-font-smoothing:antialiased; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:25; background:var(--bg); }
button { font:inherit; color:inherit; cursor:pointer; }
[hidden] { display:none !important; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.num, .v, .big, td { font-variant-numeric:tabular-nums; }
.wrap { max-width:720px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
.ic { flex:none; display:block; }
.pos { color:var(--win); } .neg { color:var(--loss); } .mut { color:var(--fg3); }
.eyebrow { font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg3); font-weight:600; }
.h2 { font-family:var(--display); font-size:20px; font-weight:500; letter-spacing:-.01em; margin:0; text-wrap:balance; }

/* header */
header.top { position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid transparent; transition:border-color .25s; }
header.top.scrolled { border-bottom-color:var(--line); }
.top .wrap { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:12px; }
.brand { display:flex; align-items:center; gap:9px; font-family:var(--display); font-size:21px; font-weight:500; letter-spacing:-.015em; }
.quiet .rise, .quiet .line, .quiet .area, .quiet .endpt, .quiet .bar, .quiet .track i, .quiet .ring .fgc, .quiet .dots i { animation:none; }
.trow.pend { opacity:.55; pointer-events:none; }
@keyframes spin { to { transform:rotate(360deg); } }

/* segmented */
.seg { position:relative; display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); background:var(--sunk); border-radius:12px; padding:3px; }
.seg::before { content:""; position:absolute; top:3px; bottom:3px; left:3px; width:calc((100% - 6px) / var(--n)); border-radius:9px; background:var(--seg-on);
  box-shadow:0 1px 2px rgba(0,0,0,.08), 0 3px 8px -2px rgba(0,0,0,.18); transform:translateX(calc(var(--i) * 100%)); transition:transform .38s cubic-bezier(.23,1,.32,1), opacity .2s; }
.seg.none::before { opacity:0; }
.seg button { position:relative; z-index:1; border:0; background:none; padding:9px 4px; border-radius:9px; font-size:14px; font-weight:500; color:var(--fg2); transition:color .25s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seg button.on { color:var(--fg); font-weight:600; }
.seg.sm button { padding:6px 4px; font-size:13px; }
.seg.file { width:172px; }
.seg button .ic { display:inline-block; vertical-align:-3px; margin-right:4px; }

/* viste */
main { padding-bottom:calc(150px + env(safe-area-inset-bottom,0px)); }
.view { display:flex; flex-direction:column; gap:14px; padding-top:6px; }

@keyframes viewIn { from { opacity:0; transform:translateY(10px); } }
.rise { animation:rise .65s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--d,0ms); }
@keyframes rise { from { opacity:0; transform:translateY(14px); } }
.card { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; min-width:0; }
.card-h { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
.card-h .sub { font-size:12.5px; color:var(--fg3); }
.link { border:0; background:none; color:var(--accent); font-weight:600; font-size:13.5px; padding:4px 0; display:inline-flex; align-items:center; gap:2px; }

/* home */
.hello { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-top:6px; }
.hello h1 { font-family:var(--display); font-weight:400; font-size:32px; line-height:1.1; letter-spacing:-.025em; margin:4px 0 0; }
.sess { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:500; color:var(--fg2); background:var(--surface); border:1px solid var(--line); padding:5px 10px 5px 9px; border-radius:99px; }
.sess i { width:7px; height:7px; border-radius:50%; background:var(--fg3); }
.sess.open i { background:var(--win); }
@keyframes pulse { 70% { box-shadow:0 0 0 7px transparent; } 100% { box-shadow:0 0 0 0 transparent; } }
.hero { position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:18px 18px 0; box-shadow:var(--shadow); }
.hero-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.big { font-family:var(--display); font-size:54px; line-height:1; letter-spacing:-.035em; font-weight:400; margin-top:10px; }
.big small { font-size:22px; color:var(--fg3); letter-spacing:0; margin-left:6px; }
.hero-usd small { font-family:var(--sans); font-size:12.5px; font-weight:500; color:var(--fg3); margin-left:7px; letter-spacing:0; }
.stepper { display:flex; align-items:center; gap:14px; height:46px; } .stepper b { font-family:var(--display); font-size:22px; font-weight:600; min-width:24px; text-align:center; }
.stepper .icon-btn { font-size:20px; font-weight:600; color:var(--fg); } .stepper .icon-btn:disabled { opacity:.35; }
.prop-sum { display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:14px; background:var(--accent-soft); color:var(--fg); font-size:13.5px; line-height:1.45; margin:4px 0 14px; } .prop-sum svg { color:var(--accent); flex:none; margin-top:1px; }
.rr-cmp { display:flex; flex-direction:column; gap:14px; margin:4px 0 14px; }
.rr-row { display:grid; grid-template-columns:minmax(150px,200px) minmax(0,1fr) auto; gap:14px; align-items:center; }
.rr-l b { display:block; font-size:14.5px; } .rr-l span { font-size:12.5px; color:var(--fg3); }
.rr-track { height:14px; border-radius:99px; background:var(--sunk); overflow:hidden; } .rr-track i { display:block; height:100%; border-radius:inherit; transform-origin:left; animation:grow 900ms var(--e-out) 200ms backwards; }
.rr-track i.t { background:color-mix(in srgb,var(--fg) 30%,var(--sunk)); } .rr-track i.r { background:var(--win); } .rr-track i.neg { background:var(--loss); }
.rr-v { font-family:var(--display); font-size:22px; font-weight:650; letter-spacing:-.02em; min-width:96px; text-align:right; }
.rr-verdict { display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:14px; background:var(--win-soft); color:var(--win); } .rr-verdict.ko { background:var(--loss-soft); color:var(--loss); }
.rr-warn { display:flex; gap:12px; align-items:flex-start; padding:14px; border-radius:14px; background:var(--warn-soft); color:var(--warn); margin-bottom:14px; }
.rr-warn > div { display:flex; flex-direction:column; gap:6px; } .rr-warn b { color:inherit; } .rr-warn span { color:var(--fg2); font-size:13.5px; line-height:1.45; } .rr-warn span b { color:var(--fg); } .rr-warn .btn { align-self:flex-start; } .rr-warn .ic { flex:none; margin-top:1px; }
.rr-list { display:flex; flex-direction:column; margin-top:12px; border:1px solid var(--line); border-radius:14px; }
.rr-list > div { display:grid; grid-template-columns:1fr auto auto; gap:12px; padding:10px 14px; font-size:13.5px; color:var(--fg2); } .rr-list > div + div { border-top:1px solid var(--line); }
.rr-list b { font-variant-numeric:tabular-nums; }
.rr-why { margin-top:10px; }
.rr-verdict b { display:block; font-size:14.5px; } .rr-verdict span { display:block; font-size:13px; color:var(--fg2); margin-top:2px; } .rr-verdict .ic { flex:none; margin-top:1px; }
.rr-how { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; } .rr-how summary { cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:13.5px; color:var(--accent); }
.rr-how summary::-webkit-details-marker { display:none; } .rr-how summary .ic { transition:transform 260ms var(--e-out); } .rr-how[open] summary .ic { transform:rotate(90deg); }
.rr-how p { font-size:13.5px; line-height:1.55; color:var(--fg2); margin:10px 0 0; } .rr-how b { color:var(--fg); } .rr-ex { background:var(--sunk); border-radius:12px; padding:10px 12px; }
@media (max-width:640px) { .rr-row { grid-template-columns:minmax(0,1fr) auto; gap:6px 12px; } .rr-row .rr-track { grid-column:1 / -1; grid-row:2; } .rr-v { font-size:19px; min-width:0; } }
.rk-bar { display:flex; height:10px; border-radius:99px; overflow:hidden; background:var(--sunk); margin:12px 0 8px; gap:2px; } .rk-bar i { display:block; height:100%; }
.rk-bar .in, .rk-leg .in { background:var(--win); } .rk-bar .ov, .rk-leg .ov { background:var(--loss); } .rk-bar .un, .rk-leg .un { background:var(--accent); }
.rk-leg { display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--fg2); } .rk-leg i { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
svg .bar.ov { fill:var(--loss); } svg .bar.un { fill:var(--accent); } svg .bar.z { fill:var(--fg3); opacity:.5; }
.ex-t td, .ex-t th { text-align:right; } .ex-t td:first-child, .ex-t th:first-child { text-align:left; }
.dmini { text-align:left; font:inherit; color:inherit; cursor:pointer; width:100%; }
.dm-rules { display:flex; flex-direction:column; gap:2px; margin-top:12px; } .dm-rules span { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--fg2); padding:5px 0; border-bottom:1px solid var(--line); }
.dm-rules span:last-child { border-bottom:0; } .dm-rules b { margin-left:auto; color:var(--fg); font-weight:600; } .dm-rules .ok .ic { color:var(--win); } .dm-rules .ko .ic { color:var(--warn); }
.usd-g { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; } .usd-g span { display:block; font-size:12.5px; color:var(--fg3); } .usd-g b { display:block; font-family:var(--display); font-size:22px; font-weight:600; letter-spacing:-.02em; margin:2px 0; } .usd-g em { font-style:normal; font-size:12px; color:var(--fg3); line-height:1.35; display:block; }
@media (max-width:640px) { .usd-g { grid-template-columns:1fr 1fr; } .usd-g > div:first-child { grid-column:1 / -1; } }
#pnl-x { margin-top:6px; } #pnl-x b { font-weight:600; }
.hero-usd { margin-top:2px; font-family:var(--display); font-size:20px; font-weight:600; letter-spacing:-.02em; color:var(--fg2); } .hero-usd.pos { color:var(--win); } .hero-usd.neg { color:var(--loss); }
.hero-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; font-size:13px; color:var(--fg2); }
.delta { display:inline-flex; align-items:center; gap:3px; font-size:12.5px; font-weight:600; padding:3px 8px 3px 6px; border-radius:99px; }
.delta.up { background:var(--win-soft); color:var(--win); } .delta.down { background:var(--loss-soft); color:var(--loss); } .delta.flat { background:var(--sunk); color:var(--fg2); }
.spark { position:relative; height:104px; margin:6px -18px 0; }
.kgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.kpi { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:4px; min-width:0; }
.kpi .v { font-family:var(--display); font-size:29px; line-height:1.1; letter-spacing:-.02em; display:flex; align-items:center; gap:8px; }
.kpi .v small { font-size:15px; color:var(--fg3); }
.kpi .h { font-size:12.5px; color:var(--fg3); line-height:1.4; }
/* valori dentro i testi secondari: più scuri e in grassetto, + verde e − rosso; puntini al posto dei «·» */
.mv { color:var(--fg2); font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.01em; white-space:nowrap; }
.mv.p { color:color-mix(in srgb,var(--win) 70%,var(--fg2)); } .mv.n { color:color-mix(in srgb,var(--loss) 70%,var(--fg2)); }
.sep { display:inline-block; width:3px; height:3px; border-radius:50%; background:currentColor; opacity:.45; margin:0 7px; vertical-align:.22em; }
.hero-usd small { display:inline-flex; align-items:center; height:20px; padding:0 8px; border:1px solid var(--line); border-radius:99px; font-size:11.5px !important; vertical-align:.3em; background:color-mix(in srgb,var(--fg) 4%,transparent); }
.hero-meta > span:not(.delta) { color:var(--fg3); }
/* il contesto entra subito dopo il numero grande, solo all'apertura della pagina */
.blk .kpi .h, .blk.kpi .h, .blk .hero-meta, .blk .hero-usd, .blk .be-row em, .blk .bd-l small { animation:metaIn 420ms var(--e-out) backwards; animation-delay:calc(var(--k,0) * var(--stg,45ms) + var(--k0,0ms) + 300ms); }
@keyframes metaIn { from { opacity:0; transform:translate3d(0,4px,0); } }
.ring { width:34px; height:34px; transform:rotate(-90deg); flex:none; }
.ring circle { fill:none; stroke-width:4.5; }
.ring .bgc { stroke:var(--sunk); } .ring .fgc { stroke:var(--accent); stroke-linecap:round; animation:ring 1.2s cubic-bezier(.3,.8,.3,1) both .15s; }
@keyframes ring { from { stroke-dashoffset:94.25; } }
.dots { display:flex; gap:6px; align-items:center; }
.dots i { width:14px; height:14px; border-radius:50%; background:var(--fg3); animation:pop .4s cubic-bezier(.23,1,.32,1) both; animation-delay:var(--d); }
.dots i.w { background:var(--win); } .dots i.l { background:var(--loss); } .dots i.b { background:transparent; border:2px solid var(--fg3); }
@keyframes pop { from { transform:scale(0); } }
.ins { display:flex; flex-direction:column; }
.ins-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:11px 0; border-top:1px solid var(--line); }
.ins-row:first-child { border-top:0; padding-top:0; }
.ins-ic { width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); }
.ins-ic.bad { background:var(--loss-soft); color:var(--loss); }
.ins-row b { display:block; font-weight:600; font-size:14.5px; }
.ins-row span { font-size:12.5px; color:var(--fg2); }
.ins-row .r { font-family:var(--display); font-size:18px; }
.tip-row { display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:start; padding:11px 0; border-top:1px solid var(--line); }
.tip-row:first-child { border-top:0; padding-top:0; }
.tip-row b { display:block; font-weight:600; font-size:14.5px; margin-bottom:2px; } .tip-row span { font-size:13px; color:var(--fg2); line-height:1.45; }
#ai-box { margin-top:14px; display:flex; flex-direction:column; gap:10px; }
.ai-go { width:100%; gap:10px; }
.ai { border-radius:16px; background:var(--sunk); padding:14px; animation:rise .35s both; }
.ai-h { display:flex; align-items:center; gap:10px; margin-bottom:8px; } .ai-h b { flex:1; font-size:14.5px; }
.md h4 { margin:12px 0 4px; font-size:14px; } .md h4:first-child { margin-top:0; }
.md p, .md li { font-size:13.5px; line-height:1.5; color:var(--fg2); margin:4px 0; } .md ul { margin:4px 0; padding-left:18px; } .md b { color:var(--fg); }
.spin.dark { border-color:color-mix(in srgb,var(--accent) 30%,transparent); border-top-color:var(--accent); }

/* elenco */
.toolbar { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:2px 16px; }
.toolbar::-webkit-scrollbar { display:none; }
.chip { flex:none; border:1px solid var(--line); background:var(--surface); padding:7px 13px; border-radius:99px; font-size:13.5px; font-weight:500; color:var(--fg2); transition:background .2s,color .2s,border-color .2s,transform .15s; }
.chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
.chip:active, .btn:active, .trow:active, .fab:active { transform:scale(.97); }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.dayh { display:flex; justify-content:space-between; align-items:baseline; padding:6px 4px 6px; font-size:13px; font-weight:600; color:var(--fg2); }
.dayh .num { font-family:var(--display); font-size:15px; font-weight:500; }
.dayc { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:0 14px; }
.trow { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:12px 0; transition:transform .15s; }
.trow:first-child { border-top:0; }
.badge { position:relative; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-weight:700; font-size:12px; letter-spacing:.03em; background:var(--sunk); color:var(--fg2); }
.badge::after { content:""; position:absolute; right:-3px; top:-3px; width:11px; height:11px; border-radius:50%; border:2.5px solid var(--surface); background:var(--fg3); }
.badge.w::after { background:var(--win); } .badge.l::after { background:var(--loss); }
.tmain { min-width:0; display:flex; flex-direction:column; gap:3px; }
.t1 { font-weight:600; font-size:15px; display:flex; gap:8px; align-items:center; min-width:0; }
.t1 .tt { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .t1 .ftag { margin-left:0; flex:none; }
.t2 { font-size:12.5px; color:var(--fg3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
.tres { display:flex; flex-direction:column; align-items:flex-end; gap:3px; } .tres b { font-size:17px !important; line-height:1.1; } .tres span { font-size:12px !important; color:var(--fg3) !important; font-variant-numeric:tabular-nums; }

/* ═════════════ Interfaccia: regole di Vercel, Emil Kowalski, Apple, Impeccable ═════════════ */
:root { color-scheme:light dark; --ease-ui:cubic-bezier(.23,1,.32,1); --ease-move:cubic-bezier(.77,0,.175,1); }
:root[data-theme="light"] { color-scheme:light; } :root[data-theme="dark"] { color-scheme:dark; }
html { -webkit-text-size-adjust:100%; }
@media (pointer:fine) { html { overscroll-behavior:none; } }
::selection { background:color-mix(in srgb,var(--accent) 24%,transparent); color:inherit; }
input, textarea { caret-color:var(--accent); } input[type=checkbox], input[type=radio], progress { accent-color:var(--accent); }
* { scrollbar-width:thin; scrollbar-color:color-mix(in srgb,var(--fg) 22%,transparent) transparent; }
button, a, [role=button], .chip, .seg button { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.sheet-b, #pal .pl-list { overscroll-behavior:contain; }
h1, h2, h3, .h2, .bp-t, .nt-next b { text-wrap:balance; } p { text-wrap:pretty; }
@media (max-width:999px) { input.inp, select.inp, textarea.inp, .chat-in textarea, #pal input { font-size:16px; } }   /* sotto i 16px iOS ingrandisce la pagina */
.skip { position:fixed; left:12px; top:-60px; z-index:100; padding:10px 14px; border-radius:10px; background:var(--fg); color:var(--bg); font-weight:600; text-decoration:none; transition:top .2s var(--ease-ui); }
.skip:focus { top:12px; }
main:focus { outline:none; }
/* hover solo dove c'è un puntatore vero */
@media not ((hover:hover) and (pointer:fine)) { .sb-i:hover, .trow:hover, .nrow:hover, .lnk:hover { background:none; } }
/* palette comandi: si apre e si chiude senza animazione (si usa molte volte al giorno) */
#pal { position:fixed; inset:0; z-index:90; display:none; align-items:flex-start; justify-content:center; padding:min(14vh,120px) 16px 16px; background:rgba(0,0,0,.32); }
#pal.on { display:flex; }
#pal .pl { width:100%; max-width:600px; max-height:min(70vh,560px); display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 24px 60px -20px rgba(0,0,0,.45); overflow:hidden; }
#pal .pl-in { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); color:var(--fg3); }
#pal input { flex:1; border:0; outline:none; background:none; font:inherit; font-size:16px; color:var(--fg); min-width:0; }
#pal kbd, .kbd { font:inherit; font-size:11.5px; color:var(--fg3); border:1px solid var(--line); border-radius:6px; padding:1px 6px; }
#pal .pl-list { overflow-y:auto; padding:6px; }

#pal .pl-i { display:flex; align-items:center; gap:12px; width:100%; padding:9px 10px; border:0; border-radius:10px; background:none; color:var(--fg); font:inherit; font-size:14.5px; text-align:left; cursor:pointer; }
#pal .pl-i .ic { color:var(--fg3); flex:none; } #pal .pl-i span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } #pal .pl-i em { font-style:normal; font-size:12.5px; color:var(--fg3); flex:none; }
#pal .pl-i.on { background:var(--active); } #pal .pl-i.on .ic { color:var(--accent); }
#pal .pl-none { padding:22px; text-align:center; color:var(--fg3); font-size:14px; }
.sb-search { display:flex; align-items:center; gap:10px; width:100%; height:38px; padding:0 12px; margin:0 0 6px; border:1px solid var(--line); border-radius:11px; background:var(--surface); color:var(--fg3); font:inherit; font-size:13.5px; cursor:pointer; white-space:nowrap; overflow:hidden; }

@media (hover:none) { #pal kbd { display:none; } }

  transition:background-color 200ms ease, border-color 200ms ease, transform 140ms var(--e-out); }

.nwd b { font-size:20px; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.15; }
.nwd i { width:7px; height:7px; border-radius:50%; background:var(--line); margin:3px 0 2px; } .nwd i.hi { background:var(--loss); } .nwd i.md { background:#FF8A00; }

/* righe del calendario: linea del tempo della giornata */
.nlist { position:relative; }
.nt-list { margin:12px -8px 0; padding-top:6px; border-top:1px solid var(--line); }
.nrow { position:relative; display:grid; grid-template-columns:52px 14px minmax(0,1fr); gap:0 14px; align-items:start; padding:12px 8px; border-radius:14px; color:inherit; text-decoration:none; transition:background-color 180ms ease; }
.nrow::before { content:""; position:absolute; left:calc(8px + 52px + 14px + 6px); top:0; bottom:0; width:2px; background:var(--line); }
.nlist .nrow:first-child::before { top:20px; } .nlist .nrow:last-child::before { bottom:calc(100% - 20px); }

.nx { min-width:0; }

.nx > span { display:block; margin-top:2px; font-size:12.5px; color:var(--fg3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.nm { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.nm span { font-size:12px; color:var(--fg3); padding:3px 8px; border-radius:8px; background:var(--sunk); font-variant-numeric:tabular-nums; white-space:nowrap; }

@media (hover:hover) and (pointer:fine) { a.nrow:hover { background:color-mix(in srgb,var(--fg) 4%,transparent); } a.nrow:hover .nx > b { color:var(--accent); } }
.nday .card-h { margin-bottom:4px; } .nday .nlist { margin:0 -8px; }

/* Panoramica e Analisi: risultato e riquadri con il carattere della versione del 20 ottobre */

.blk .ring .fgc { animation:ringIn 1100ms var(--e-out) backwards; animation-delay:calc(var(--k,0) * var(--stg) + var(--k0,0ms) + 200ms); }

/* ═════════════ Movimento ═════════════
   Pesi (design-motion-principles): Jakub per le entrate e le rifiniture, Emil per frequenza e tastiera, Jhey solo nei momenti rari.
   · cambio pagina: la vecchia scivola via nella direzione opposta, i blocchi della nuova salgono in sequenza (opacità + 18px + sfocatura)
   · numeri che contano fino al valore, grafici che si disegnano, barre che crescono; ai cambi di filtro i numeri scorrono dal valore vecchio
   · molle (linear) per indicatori, pillole e spunte; scorciatoie da tastiera e palette ⌘K restano istantanee */
:root {
  --e-out:cubic-bezier(.16,1,.3,1); --e-in:cubic-bezier(.55,0,1,.45); --e-io:cubic-bezier(.65,0,.35,1); --e-drawer:cubic-bezier(.32,.72,0,1);
  --spring:linear(0, 0.025, 0.09, 0.178, 0.277, 0.381, 0.481, 0.575, 0.66, 0.735, 0.799, 0.853, 0.897, 0.932, 0.959, 0.98, 0.995, 1.006, 1.013, 1.017, 1.019, 1.02, 1.019, 1.018, 1.016, 1.014, 1.012, 1.01, 1.008, 1.007, 1.005, 1.004, 1.003, 1.002, 1.001, 1.001, 1, 1, 1, 1, 1);

/* 1 · blocchi della pagina: entrano in sequenza; quelli più in basso quando ci arrivi scorrendo */
.blk { will-change:transform, opacity, filter; animation:blkIn 600ms var(--e-out) backwards; animation-delay:calc(var(--k,0) * var(--stg) + var(--k0,0ms)); }
/* sfocatura che si scioglie prima della fine (al 65%): niente scatto verso il nitido; niente scala (sfocherebbe il testo) */
@keyframes blkIn { 0% { opacity:0; transform:translate3d(0,16px,0); filter:blur(7px); } 65% { filter:blur(0); } 100% { opacity:1; transform:translate3d(0,0,0); filter:blur(0); } }

.blk .chart .endpt { animation:mPop 560ms var(--spring-pop) backwards; animation-delay:calc(var(--k,0) * var(--stg) + var(--k0,0ms) + 1250ms); }
.blk .bar { animation:barIn 700ms var(--e-out) backwards; animation-delay:calc(var(--k,0) * var(--stg) + var(--k0,0ms) + 180ms + var(--bi,0) * 38ms); }
.blk .track i, .blk .ds-bar i, .blk .chk-bar i { transform-origin:left center; animation:grow 900ms var(--e-out) backwards; animation-delay:calc(var(--k,0) * var(--stg) + var(--k0,0ms) + 220ms + var(--d,0ms)); }
.blk .dots i { animation:mPop 480ms var(--spring-pop) backwards; animation-delay:calc(var(--k,0) * var(--stg) + var(--k0,0ms) + 160ms + var(--d,0ms)); }
.blk .fchip { animation:mPop 420ms var(--spring-pop) backwards; animation-delay:calc(var(--k,0) * var(--stg) + 120ms); }

@keyframes mPop { from { opacity:0; transform:scale(.4); } }

.redraw .chart .line { animation:draw 760ms var(--e-io) backwards; }

  @keyframes sbIn { 0% { opacity:0; transform:translate3d(-12px,0,0); filter:blur(4px); } 65% { filter:blur(0); } 100% { opacity:1; transform:translate3d(0,0,0); filter:blur(0); } }

  bands: [['14:30–15:30',870,930],['15:30–16:00',930,960],['16:00–17:00',960,1020],['17:00–18:00',1020,1080],['18:00–19:00',1080,1140]],
  days: ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì'], dir: ['Long','Short'], exe: ['Trade valido','Errore'],
  errs: ['FOMO','TP spostato','SL spostato','Ingresso anticipato','Uscita anticipata','Size sbagliata','Fuori piano','Altro'],

const APP = 'Edgebook';
const BUILD = '2026-10-27.4';   // cambia a ogni pubblicazione: se online c'è una versione più nuova, l'app si aggiorna da sola

function checkUpdate() {
  if (viaScript() || location.protocol==='file:' || Date.now()-updChk<60000) return; updChk=Date.now();
  fetch(location.pathname+'?u='+Date.now(), { cache:'no-store' }).then(r=>r.ok?r.text():'').then(t=>{
    const m=/const BUILD = '([^']+)'/.exec(t||''); if (!m || m[1]===BUILD || S.sheet==='form') return;   // un trade in scrittura non si interrompe
    try { if (sessionStorage.getItem('tj.upd')===m[1]) return; sessionStorage.setItem('tj.upd', m[1]); } catch(e) {}
    toast('Nuova versione di '+APP+': aggiorno…');
    setTimeout(()=>location.replace(location.pathname+'?v='+encodeURIComponent(m[1])+location.hash), 900);   // indirizzo nuovo: niente copia vecchia in cache
  }).catch(()=>{});
}
const EM1 = '1° EMA';   // unico entry model: sempre scritto così, mai chiesto
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MESI_F = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

      const r = edit ? rows.find(x=>x._row===edit.row && same(x)) : rows.slice().reverse().find(same);

function call(fn, ...args) {

  return fetch(url, { method:'POST', body: JSON.stringify({ key, fn, args }), signal: ctl ? ctl.signal : undefined })
    .catch(() => { throw new Error('NETWORK'); })
    .finally(() => clearTimeout(to))
    .then(r => { if (!r.ok) throw new Error('Il server ha risposto '+r.status); return r.json(); })
    .then(d => { if (d.ok) return d.result; if (d.error==='CHIAVE_ERRATA') { showSetup('La chiave non è valida: controllala e riprova.'); throw new Error('Chiave non valida'); } throw new Error(d.error); });

function smoothScroll(y) {
  scrStop(); const max=document.documentElement.scrollHeight-innerHeight, y0=scrollY, dy=Math.max(0,Math.min(y,max))-y0; if (Math.abs(dy)<2) return;
  if (reduceMotion()) { scrollTo({ top:y0+dy, behavior:'instant' }); return; }

// esecuzione: quanto vale davvero in R ogni trade, dal PnL scritto e dal rischio delle Impostazioni.
// La differenza tra RR reale e teorico ha due cause, che qui si separano con una retta sui trade (PnL = rischio × RR − costi):
// - i costi (commissioni e slippage): circa fissi a trade, rendono ogni loss più cara di 1 R e ogni vincente un po' più magro;
// - la size: il rischio effettivo per R diverso da quello impostato.

function execFit(P) {

  return a>0 && isFinite(c) ? { a, c } : null;
}

  if (!P.length) return { html: dcard('RR teorico e RR reale', 'esecuzione', '<p class="ds-note">Nessun trade del periodo ha il PnL scritto. Aggiungilo nei trade (campo «PnL su un conto») per vedere quanto ti costano slippage, commissioni e size.</p>', 'wide') };
  const rp=t=>t.pnl/k, gap=t=>rp(t)-t.rr, sum=(a,f)=>a.reduce((s,t)=>s+f(t),0);
  const Rt=sum(P,t=>t.rr), Rp=sum(P,rp), G=Rp-Rt;
  // con pochi trade nel periodo costi e rischio effettivo si stimano su tutto lo storico del Journal

}
function propChanged(rerender) { syncTouch('prop'); if (rerender && S.tab==='set') renderCurrent(true); }
// rischio e conti uguali su tutti i dispositivi, salvati nello script (appSettings). Ogni impostazione ha la sua data
// di modifica e per ciascuna vince la più recente: cambiare il rischio sul PC non riporta indietro i conti cambiati sul telefono.
// Prima di salvare si rilegge il server e si uniscono le due versioni.
const SYNC_KEYS=['risk','prop','rev']; let pushT=0;
const syncTs = () => (CFG.syncTs = CFG.syncTs || {});
function syncTouch(k) { syncTs()[k]=Date.now(); saveCfg(); pushSettings(); }
function syncMerge(o) {
  const T=syncTs(), oT=(o && o.ts) || {}; let changed=false, newer=!o;
  SYNC_KEYS.forEach(k=>{ const st=o ? (oT[k] || 0) : 0, lt=T[k] || 0;
    if (o && (k in o) && st>lt) { CFG[k]=o[k]; T[k]=st; changed=true; } else if (lt>st) newer=true; });
  if (changed) { normProp(); saveCfg(); if (S.loaded && !S.sheet) renderCurrent(true); }
  return newer;
}
function pushSettings() { if (S.noSync) return; clearTimeout(pushT); pushT=setTimeout(async ()=>{
  try { syncMerge(await call('appSettings')); const out={ t:Date.now(), ts:Object.assign({}, syncTs()) }; SYNC_KEYS.forEach(k=>{ out[k]=CFG[k]; });
    await call('appSettings', out); } catch(e) { if (/sconosciuta/i.test(e.message||'')) S.noSync=true; } }, 600); }
async function pullSettings() {
  try { if (syncMerge(await call('appSettings'))) pushSettings(); } catch(e) { if (/sconosciuta/i.test(e.message||'')) S.noSync=true; }
}
function cfgChanged(k) {
  if (k==='risk') syncTouch('risk');

}

// ───────────────────────── REVISIONE SETTIMANALE (EOW) ─────────────────────────
// Ogni weekend la settimana appena finita si rivede nell'EOW: prima ES da lunedì a venerdì, poi NQ. Parte il venerdì dopo la
// fine della sessione (Impostazioni → sessione) e resta finché non è completa, anche nei giorni dopo. Ogni giorno mostra le
// news USD e le scrive nel trade (Red se c'è almeno un evento ad alto impatto, Orange se medio, anche fuori sessione).
// Lo stato (CFG.rev) è sincronizzato tra i dispositivi come rischio e conti: { wk: lunedì, ES:[giorni fatti], NQ:[…], fin }.
const REV_A = ['ES','NQ'];
function revWeek() {   // lunedì della settimana da rivedere
  const r=romeDate(Date.now()), mon=pdIso(weekOf(iso(r))), wd=(r.getDay()+6)%7;
  const after = wd>4 || (wd===4 && r.getHours()*60+r.getMinutes() >= mins(CFG.s1||'18:30'));
  return iso(addDays(mon, after ? 0 : -7));
}
function revState() { const wk=revWeek(); let v=CFG.rev;
  if (!v || v.wk!==wk) v={ wk, ES:[], NQ:[], fin:false };
  return v; }
const revDays = wk => [0,1,2,3,4].map(i=>iso(addDays(pdIso(wk),i)));
const revDue = () => !revState().fin;
function revSave(v) { CFG.rev=v; syncTouch('rev'); }
function revPos(v) {   // dove sei: l'asset e il giorno scelti, se no il primo giorno ancora da fare
  const days=revDays(v.wk);
  if (S.revSel && S.revSel.wk===v.wk) return S.revSel;
  for (const a of REV_A) { const d=days.find(x=>!v[a].includes(x)); if (d) return { wk:v.wk, a, d }; }
  return { wk:v.wk, a:'NQ', d:days[4] };
}
S.revLater = (()=>{ try { return sessionStorage.getItem('tj.revLater')===revWeek(); } catch(e) { return false; } })();
// news della settimana: dall'archivio dello script (newsWeek), intanto dal calendario già scaricato
S.nw = (()=>{ try { return JSON.parse(localStorage.getItem('tj.nw')||'{}')||{}; } catch(e) { return {}; } })();
const nwP={};
function revNewsLoad(wk) {
  const c=S.nw[wk], end=pdIso(wk).getTime()+5*dayMs;
  if ((c && c.got>end+6*3600000) || nwP[wk]) return;   // già preso a settimana finita
  nwP[wk]=call('newsWeek', wk).then(d=>{ S.nw={ [wk]:{ ev:d.ev, got:Date.now() } }; try { localStorage.setItem('tj.nw', JSON.stringify(S.nw)); } catch(e) {} })
    .catch(e=>{ S.nwErr = /sconosciuta/i.test(e.message||'') ? 'OLD' : (e.message||String(e)); })
    .finally(()=>{ setTimeout(()=>{ delete nwP[wk]; }, 60000); if (S.tab==='list' && !S.sheet) renderCurrent(true); });
}
function revNews(wk) {
  const c=S.nw[wk]; if (c && c.ev && c.ev.length) return c.ev.map(mapEv);
  const ev=newsEvents().filter(e=>weekOf(e.day)===wk); return ev.length ? ev : null;
}
const catOf = ev => ev.some(e=>e.cur==='USD' && e.imp==='High') ? 'Red News' : ev.some(e=>e.cur==='USD' && e.imp==='Medium') ? 'Orange News' : 'No News Day';
const catCls = c => c==='Red News'?'hi':c==='Orange News'?'md':'';
const catLbl = c => ({ 'Red News':'Red', 'Orange News':'Orange', 'No News Day':'Nessuna news' })[c] || c;
const revAsset = t => /NQ/i.test(t.a||'') ? 'NQ' : 'ES';
const revTrades = (a, d) => S.file==='EOW' ? all().filter(t=>iso(t.d)===d && revAsset(t)===a) : [];
const dayName = d => { const x=pdIso(d); return GIORNI[x.getDay()].replace(/^./,c=>c.toUpperCase())+' '+x.getDate(); };

// ───────────────────────── COACH (consigli dal periodo filtrato) ─────────────────────────
// Ogni gruppo (idea, fascia, giorno…) è giudicato sulla resa media per trade in R, «corretta» per il numero di trade:
// con pochi trade il valore viene avvicinato alla media generale (k=5), così 3 su 3 non vale come 30 su 40.
// «Forte» se anche il caso pessimo (80% di fiducia) è sopra zero, «da evitare» se anche il caso migliore è sotto zero.
const COACH_K = 5, COACH_Z = 1.28;
function rStats(rs) { const n=rs.length; if (!n) return { n:0 }; const mean=rs.reduce((x,y)=>x+y,0)/n;
  const sd = n>1 ? Math.sqrt(rs.reduce((s,r)=>s+(r-mean)*(r-mean),0)/(n-1)) : 0, se = n>1 ? sd/Math.sqrt(n) : Infinity;
  return { n, mean, lo:mean-COACH_Z*se, hi:mean+COACH_Z*se, sum:mean*n }; }
function coachGroups(ts, m, keyFn, keys, overall) {
  return keys.map(k=>{ const g=ts.filter(t=>keyFn(t)===k); if (g.length<3) return null; const st=rStats(g.map(m.rOf)), a=agg(g,m);
    const shr=(st.sum+COACH_K*overall)/(st.n+COACH_K);
    return { k, n:st.n, wr:a.wr, R:st.sum, exp:st.mean, shr, lo:st.lo, hi:st.hi, verdict: st.n>=5 && st.lo>0 ? 'forte' : st.n>=5 && st.hi<0 ? 'evitare' : 'neutro' }; })
    .filter(Boolean).sort((a,b)=>b.shr-a.shr);
}
function coachData(scope) {
  const E=S.type==='EOW', T=tgt(), m=curModel(), allSc=(scope||S.coachScope)==='all', ts=allSc ? all() : filtered(m); if (ts.length<5) return null;
  const all0=rStats(ts.map(m.rOf)), overall=all0.mean, a=agg(ts,m);
  const dims=[['Idea 5m',t=>t.idea,L.idea],['Fascia oraria',bandOf,L.bands.map(b=>b[0])],['Giorno',t=>t.day,L.days],['News',t=>t.news,L.news],
    ['SMT',t=>t.smt,L.smt],['Coming from LVN',t=>t.lvn==='Si'?'Da LVN':t.lvn==='No'?'Non da LVN':'',['Da LVN','Non da LVN']],
    ['Struttura 1m',t=>t.clean?'1m pulito':'1m non pulito',['1m pulito','1m non pulito']],['Asset',t=>t.a,L.asset]];
  if (hasCol('Direzione')) dims.push(['Direzione',t=>t.dir,['Long','Short']]);
  if (E && hasCol('2° CC')) dims.push(['2° CC',t=>t.cc2?'Con 2° CC':'Senza 2° CC',['Con 2° CC','Senza 2° CC']]);
  const groups={}; dims.forEach(([name,fn,keys])=>{ const g=coachGroups(ts,m,fn,keys,overall); if (g.length) groups[name]=g; });
  let targets=null;
  if (E) targets=[1,2,3,4,5].map(k=>{ const mm=model(k), st=rStats(ts.map(mm.rOf)); return { T:k, wr:ts.filter(mm.isWin).length/ts.length, exp:st.mean, lo:st.lo }; });
  const best = targets ? targets.slice().sort((x,y)=>y.lo-x.lo)[0] : null;
  const recentN=Math.min(20, Math.floor(ts.length/2)), rec = recentN>=5 ? rStats(ts.slice(-recentN).map(m.rOf)) : null;
  const dayNews=[]; L.days.forEach(d=>L.news.forEach(nw=>{ const g=ts.filter(t=>t.day===d && t.news===nw); if (g.length>=3) { const st=rStats(g.map(m.rOf)); dayNews.push({ day:d, news:nw, n:st.n, exp:st.mean, shr:(st.sum+COACH_K*overall)/(st.n+COACH_K) }); } }));
  let disc=null;
  if (!E && hasCol('Esecuzione')) { const ok=ts.filter(t=>t.exe==='Trade valido'), ko=ts.filter(t=>t.exe==='Errore'); if (ok.length+ko.length) {
    const errs={}; ko.forEach(t=>(t.errs||[]).forEach(e=>{ (errs[e]=errs[e]||{n:0,R:0}); errs[e].n++; errs[e].R+=m.rOf(t); }));
    disc={ valid:ok.length, errors:ko.length, R_valid:ok.reduce((s,t)=>s+m.rOf(t),0), R_errors:ko.reduce((s,t)=>s+m.rOf(t),0), byError:errs }; } }
  const d0=ts[0].d, d1=ts[ts.length-1].d;
  return { file:S.file, esito: E?'EOW: vinto '+T+'R se il trade arriva a '+T+'R prima dello stop, altrimenti −1R':'Journal: RR scritto nel trade (il PnL in dollari può differire per commissioni, slippage e size)',
    periodo: d0.getDate()+' '+MESI[d0.getMonth()]+' '+d0.getFullYear()+' → '+d1.getDate()+' '+MESI[d1.getMonth()]+' '+d1.getFullYear(),
    filtri: allSc ? ['nessuno: tutti i trade del file'] : activeFilters().map(x=>x.l), trade:ts.length, winrate:a.wr, R_totali:a.R, expectancy:overall, profit_factor:isFinite(a.pf)?a.pf:null, max_drawdown_R:a.dd,
    target_attuale: E?T:null, targets, target_consigliato: best && best.T, forma_recente: rec && { ultimi:recentN, expectancy:rec.mean, storico:overall },
    gruppi: groups, giorno_news: dayNews.sort((x,y)=>y.shr-x.shr), disciplina: disc,
    oggi: GIORNI[new Date().getDay()]+' '+new Date().getDate()+' '+MESI_F[new Date().getMonth()] };
}
const fR = x => fmtR(x,2);
function coachCard(cd) {

  if (E && cd.targets) { const b=cd.targets.find(t=>t.T===cd.target_consigliato), cur=cd.targets.find(t=>t.T===cd.target_attuale);
    tips.push({ i:'target', c:'', h:'Target consigliato: '+b.T+'R', p: b.T===cd.target_attuale ? 'È quello che stai già usando: resa media '+fR(b.exp)+' per trade (WR '+pct(b.wr)+').'
      : 'Resa media '+fR(b.exp)+' per trade (WR '+pct(b.wr)+'), contro '+fR(cur.exp)+' a '+cur.T+'R. È il target che regge meglio anche nel caso pessimo.' }); }

  const strong=allG.filter(g=>g.verdict==='forte').sort((a,b)=>b.shr-a.shr).slice(0,3), avoid=allG.filter(g=>g.verdict==='evitare').sort((a,b)=>a.shr-b.shr).slice(0,3);

  avoid.forEach(g=>tips.push({ i:'alert', c:'neg', h:'Da evitare · '+g.dim+': '+g.k, p:fR(g.exp)+' per trade su '+g.n+' trade (WR '+pct(g.wr)+'): negativo anche nel caso migliore.' }));
  if (!strong.length && !avoid.length) { const top=allG.filter(g=>g.n>=5)[0]; if (top) tips.push({ i:'target', c:'', h:'Il più promettente: '+top.dim+' '+top.k, p:fR(top.exp)+' per trade su '+top.n+' trade. Non ancora abbastanza trade per esserne sicuri.' }); }
  if (cd.forma_recente) { const f=cd.forma_recente, dv=f.expectancy-f.storico;
    tips.push({ i:dv>=0?'trendUp':'trendDn', c:dv>=0?'pos':'neg', h:'Forma recente: '+(Math.abs(dv)<0.1?'in linea':dv>0?'meglio del solito':'peggio del solito'), p:'Ultimi '+f.ultimi+' trade: '+fR(f.expectancy)+' per trade, contro '+fR(f.storico)+' del periodo.' }); }

    tips.push({ i:'clock', c:'', h:'Prossimi giorni', p:'Meglio: '+b.day+' con '+b.news+' ('+fR(b.exp)+' su '+b.n+'). '+(w.exp<0?'Più difficile: '+w.day+' con '+w.news+' ('+fR(w.exp)+' su '+w.n+').':'') }); }
  if (cd.disciplina) { const d=cd.disciplina, tot=d.valid+d.errors;
    tips.push({ i:'check', c:d.R_errors<0?'neg':'', h:'Disciplina: '+pct(d.valid/tot)+' di trade validi', p:'Validi '+fR(d.valid?d.R_valid/d.valid:NaN)+' per trade, con errori '+fR(d.errors?d.R_errors/d.errors:NaN)+' ('+d.errors+' trade). '+(d.errors?'I più costosi: '+Object.entries(d.byError).sort((a,b)=>a[1].R-b[1].R).slice(0,2).map(([k,v])=>k+' '+v.n+'× ('+fmtR(v.R,1)+')').join(', ')+'.':'') }); }

    '<div id="ai-box">'+aiBox()+'</div>';
  return card('Consigli', cd.trade+' trade · '+cd.periodo, body, 240);
}

// ───────────────────────── SIMULA: passare le valutazioni Topstep ─────────────────────────
// Quanti conti passare, di che taglia e in quanto tempo lo sceglie l'utente; il simulatore cerca il resto: quali trade prendere
// (combinazioni di filtri sui trade dell'EOW: i filtri della pagina qui non valgono), il target in R, le regole del giorno,
// con o senza Daily Loss Limit, il rischio a trade e come tradare più conti. Ogni calcolo usa numeri casuali nuovi.
// Regole Topstep: 50K confermate dall'utente; prezzi e limiti di 100K/150K da verificare.
const PF_PRE = {
  '50K':  { target:3000, mll:2000, dllAmt:1000, feeD:85,  feeN:95,  lots:5 },
  '100K': { target:6000, mll:3000, dllAmt:2000, feeD:155, feeN:165, lots:10 },
  '150K': { target:9000, mll:4500, dllAmt:3000, feeD:235, feeN:245, lots:15 } };

const PF_SLIP = .25;                         // slippage: 1 tick (0,25 punti) sugli stop e sulle chiusure forzate, ordini a mercato
const PF_BUF = { ES:1, NQ:5 };               // buffer già compreso negli stop dell'EOW e del Journal (punti oltre il livello di struttura)

function loadPF() { try { const o=Object.assign({}, PF_DEF, JSON.parse(store.get('pf5','{}'))); if (!PF_PRE[o.size]) o.size='50K'; return o; } catch(e) { return Object.assign({}, PF_DEF); } }

const usd = (x, dec=0) => isFinite(x) ? (x<0?'−':'')+'$'+Math.abs(x).toLocaleString('it-IT',{ maximumFractionDigits:dec, minimumFractionDigits:dec }) : '–';
// ───── dollari e conti prop ─────
// Ogni trade del Journal ha il suo PnL in $ per conto (colonna «PnL $»); se manca vale RR × rischio delle Impostazioni.
// Con il copy trading il PnL si moltiplica per i conti attivi quel giorno. L'EOW (backtest) usa sempre R × rischio.
const riskUsd = () => { const v=num(CFG.risk); return isFinite(v) && v>0 ? v : 0; };
const nAcc = () => (CFG.prop && +CFG.prop.n) || 1;   // conti su cui copi ogni trade
const totView = () => !CFG.prop || CFG.prop.view!=='one';
const isEst = t => !isFinite(t.pnl);
const pnl1 = (t, r) => isFinite(t.pnl) ? t.pnl : riskUsd() ? r*riskUsd() : NaN;               // $ su un conto
const usdT = (t, r) => { const v=pnl1(t, r); return isFinite(v) ? v*(totView() ? nAcc(t.d) : 1) : NaN; };   // $ mostrati
let uoJ, uoV;
function usdOn(E) { if (E===undefined) E=S.type==='EOW'; if (riskUsd()) return true; if (E) return false;
  const J=rowsOf('Journal'); if (J!==uoJ) { uoJ=J; uoV=!!J && J.some(t=>isFinite(t.pnl)); } return uoV; }
const usdSum = (ts, m) => ts.reduce((s,t)=>{ const v=usdT(t, m.rOf(t)); return isFinite(v) ? s+v : s; }, 0);
function usdDD(ts, m) { let eq=0, pk=0, dd=0; ts.forEach(t=>{ const v=usdT(t, m.rOf(t)); if (isFinite(v)) eq+=v; pk=Math.max(pk,eq); dd=Math.min(dd,eq-pk); }); return dd; }
const fmtU = (v, est) => isFinite(v) ? (est?'≈':'')+(v>=0.5?'+':'')+usd(v) : '';
const fmtUk = v => isFinite(v) ? (v<=-0.5?'−':v>=0.5?'+':'')+'$'+usdK(Math.abs(v)) : '';
const withU = (txt, v, est) => { const u=fmtU(v, est); return u ? u+(txt?' · '+txt:'') : txt; };
const usdWhat = () => nAcc()>1 ? (totView() ? nAcc()+' conti' : 'un conto') : '';
const usdK = x => { const a=Math.abs(x); return (x<0?'−':'')+(a>=1e6 ? fmtN(a/1e6,a>=1e7?0:1)+'M' : a>=1e3 ? fmtN(a/1e3,a>=1e5?0:a%1000?1:0)+'k' : fmtN(a,0)); };
// ── 1. i trade dell'EOW e le strategie (combinazioni di filtri) ──
// Ogni giorno feriale tra il primo e l'ultimo trade dell'EOW, con i suoi trade (anche nessuno): così un filtro che toglie trade
// allunga davvero i tempi. Per ogni trade: stop in punti (SL Points) e quanto è andato contro (SL DD), in R.
function pfBase() {
  const E=rowsOf('EOW'); if (!E) return null;
  const ts=E.filter(t=>t.d && isFinite(t.best) && t.d.getDay()%6!==0), days=[], idx={};
  if (ts.length) for (let d=new Date(ts[0].d.getFullYear(),ts[0].d.getMonth(),ts[0].d.getDate()); d<=ts[ts.length-1].d; d.setDate(d.getDate()+1)) { if (d.getDay()%6===0) continue; idx[iso(d)]=days.length; days.push(iso(d)); }
  const di=ts.map(t=>idx[iso(t.d)]), sl=ts.map(t=>{ const v=num(t.raw['SL Points']); return v>0?Math.max(v, PF_BUF[/NQ/i.test(t.a||'')?'NQ':'ES']):0; }), dd=ts.map(t=>{ const v=num(t.raw['SL DD']); return v>=0?v:NaN; });
  // peso dei giorni: si dimezza ogni «hl» giorni feriali andando indietro, così le scelte guardano soprattutto al periodo recente;
  // «cut» separa gli ultimi giorni (l'ultimo 30%, almeno 20) su cui ogni filtro deve reggere
  const n=days.length, hl=Math.max(20, Math.round(n*.25)), w=days.map((_,i)=>Math.pow(.5,(n-1-i)/hl)), cut=Math.max(0, Math.min(Math.floor(n*.7), n-20));
  const slq={}; ['ES','NQ'].forEach(a=>{ const v=ts.map((t,i)=>(/NQ/i.test(t.a||'')?'NQ':'ES')===a?sl[i]:0).filter(x=>x>0).sort((x,y)=>x-y); if (v.length>=10) slq[a]={ p75:v[Math.floor(.75*(v.length-1))], p90:v[Math.floor(.9*(v.length-1))] }; });
  // escursione contraria in R (SL DD / stop). Nei vincenti uno SL DD pari o oltre lo stop vuol dire che è stato misurato dopo il
  // target (es. «raggiunge 2,2R, poi torna a BE»): lì, e quando manca, vale la mediana degli altri vincenti
  const okW=(t,i)=>t.best>=1 && sl[i]>0 && isFinite(dd[i]) && dd[i]<sl[i];
  const mw=ts.map((t,i)=>okW(t,i)?dd[i]/sl[i]:NaN).filter(isFinite).sort((x,y)=>x-y), maeW=mw.length?mw[Math.floor(mw.length/2)]:.5;
  const mae=ts.map((t,i)=>sl[i]>0 && isFinite(dd[i]) && dd[i]<sl[i] ? dd[i]/sl[i] : maeW);   // per gli stop pieni la simulazione usa comunque 1R
  return { ts, days, di, sl, mae, slq, dir:ts.some(t=>t.dir), w, hl, cut };
}
// T: target in R · maxN: trade al giorno (0 = senza limite) · sw: stop dopo il primo trade in profitto · sll: stop dopo 1 o 2 perdite
// xsl: niente trade con stop oltre il 75° o 90° percentile del suo asset · gli altri: filtri come nella pagina Filtri
const PF_TG = [.5,1,1.5,2,2.5,3,3.5,4,4.5,5];   // target provati, in R
const pfT = T => fmtN(T, T%1?1:0)+'R';
const PF_ST0 = { T:2, asset:'', maxN:0, sw:0, sll:0, xsl:'', xIdea:[], smt:'', news:'', lvn:'', clean:'', xBand:[], xDay:[], dir:'' };

// holding dei livelli: i minuti si contano dalla candela dopo l'ingresso (15:40 → 15:44 = 3 min),
// ma un livello toccato nella candela subito dopo vale 1 min (15:40 → 15:41 = 1 min)
const holdMin = d => d<=1 ? d : d-1;
const holdBack = h => h>=1 ? h+1 : h;   // inverso, per ricostruire l'orario quando modifichi un trade
// PnL scritto nel modulo: senza segno prende quello del trade (in perdita è negativo), così basta scrivere 210
function pnlVal(v, rr) { if (empty(v) || !isNumStr(v)) return NaN; let x=numS(v); if (!/[-−]/.test(v) && rr<0) x=-Math.abs(x); return x; }
function compute() {
  const f=S.f, E=S.type==='EOW', w=[];

  const best = isFinite(max) ? Math.min(5, Math.floor(max+1e-9)) : NaN;
  const bestLbl = isFinite(best) ? (best<1?'<1rr':best+'rr') : '';
  let out='';
  if (E) out = isFinite(max) ? (max>=2?'Win':'Loss') : '';
  else out = isFinite(rr) ? (rr>0?'Win':rr<0?'Loss':'BE') : '';
  const o=mins(f.Ora), h={};
  if (E) { for (let k=1;k<=5;k++){ const t=mins(f['t'+k]); if (k<=best && isFinite(t) && isFinite(o) && t>=o) h[k]=hhmm(holdMin(t-o)); } }
  const ox=mins(f.Uscita), hold = !E && isFinite(o) && isFinite(ox) && ox>o ? hhmm(holdMin(ox-o)) : '';
  if (isFinite(o) && (o<SESS[0] || o>SESS[1])) w.push('Ora fuori dalla sessione '+CFG.s0+'–'+CFG.s1+'.');
  if (E && out==='Win' && isFinite(dd) && isFinite(sl) && dd>=sl) w.push('SL DD ≥ SL ma l\'esito è Win: controlla.');
  if (!E) { const pv=pnlVal(f.pnl, rr); if (isFinite(pv) && isFinite(rr) && ((rr>0 && pv<0) || (rr<0 && pv>0))) w.push('PnL e RR hanno segno diverso: controlla.'); }
  const dup = S.rows.find(r => r.Asset===f.Asset && r.Data===fmtIt(f.Data) && String(r.Ora).slice(0,5)===String(f.Ora||'').slice(0,5) && (!S.edit || r._row!==S.edit.row));
  if (dup) w.push('Esiste già un trade '+f.Asset+' con stessa data e ora (riga '+dup._row+').');
  return { sl, dd, max, rr, best, bestLbl, out, h, hold, warn:w };
}

      if (i2>=0) { S.rows[i2]=obj; touchRows(); } else if (D) { applyData(D); touchRows(); }   // nel frattempo è arrivata una rilettura del foglio
      if (S.flash===prov) S.flash=obj; if (!S.sheet) renderCurrent(true); }
    toast(edit ? 'Modifiche salvate' : 'Trade salvato in '+file);
    if (d['PnL $']!==undefined && d['PnL $']!=='' && !res.h) setTimeout(()=>toast('Il PnL non è stato salvato: aggiorna Code.gs alla versione nuova', true), 2900);
  } catch(e) {
    const i2=S.rows.indexOf(prov); if (i2>=0) { if (prev) S.rows[i2]=prev; else S.rows.splice(i2,1); touchRows(); }
    renderCurrent(true);
    if (S.file===file && !S.sheet) { S.sheet='form'; S.f=form; S.edit=edit; $('sh-title').textContent = edit?'Modifica trade':'Nuovo trade'; renderForm(); openSheet(); }
    toast('Non salvato: '+errTxt(e)+'. Riprova.', true);
  } finally { setSync(false); }
}

// ───────────────────────── scheda: apertura e chiusura ─────────────────────────
function openSheet(panel) { $('sheet').classList.toggle('panel', !!panel);   // «panel»: su PC la scheda è un pannello a destra (non «side», che è la barra laterale)
  $('sheet').classList.add('open'); $('scrim').classList.add('open'); $('fab').classList.add('hide'); $('aifab').classList.add('hide'); document.body.style.overflow='hidden'; $('sh-body').scrollTop=0; }
function closeSheet() { if (S.sheet==='chat') setTimeout(()=>{ if (!S.sheet) { $('sh-body').innerHTML=''; $('sh-foot').innerHTML=''; } }, 520);
  $('sheet').classList.remove('open'); $('scrim').classList.remove('open'); $('fab').classList.toggle('hide', ['mc','coach','news','set'].includes(S.tab)); $('aifab').classList.toggle('hide', S.tab==='coach'); document.body.style.overflow=''; S.sheet=null; }

// ───────────────────────── eventi ─────────────────────────
document.addEventListener('click', e => {
  const b=e.target.closest('button'); if (!b) return;
  S.userT=performance.now();
  if (b.closest('#lb')) return;
  if (b.dataset.lb) { lbOpen(lbList(S.f), +b.dataset.lb, b.querySelector('img')); return; }
  if (b.dataset.act==='pal') { palToggle(true, true); return; }
  if (b.closest('#pal')) { const i=+b.dataset.pi; if (isFinite(i)) palRun(i); return; }
  if (b.dataset.nav) { navTo(b.dataset.nav); return; }
  if (revClick(b)) return;
  if (b.dataset.bar) { if (b.dataset.bar==='more') openMore(); else navTo(b.dataset.bar); return; }
  if (b.closest('#fileSeg')) { switchFile(b.dataset.v); return; }
  if (b.dataset.act==='sbcol') { const c=document.documentElement.classList.toggle('sbc'); store.set('sbc', c?'1':''); setTimeout(moveInd, 60); setTimeout(moveInd, 560); return; }
  if (b.dataset.act==='newsref') { b.disabled=true; loadTrump(true).catch(()=>{}); loadNews(true).then(()=>toast('Calendario aggiornato')).catch(e=>toast('News non disponibili: '+(e.message||e), true)); return; }
  if (b.dataset.chk) { const i=+b.dataset.chk, ck=chkGet(), on=!ck.includes(i), nk=on?[...ck,i]:ck.filter(x=>x!==i); store.set(chkKey(), JSON.stringify(nk)); b.classList.toggle('on', on); b.classList.remove('just'); void b.offsetWidth; b.classList.add('just'); clearTimeout(b._j); b._j=setTimeout(()=>b.classList.remove('just'), 700);
    const c=b.closest('.bchk'), tot=CFG.check.length, done=CFG.check.filter((_,j)=>nk.includes(j)).length; c.querySelector('.chk-bar i').style.width=(100*done/tot)+'%'; $('chk-n').textContent=done+'/'+tot; c.classList.toggle('ok', done===tot);
    c.classList.remove('party'); if (on && done===tot) { void c.offsetWidth; c.classList.add('party'); setTimeout(()=>c.classList.remove('party'), 1600); } return; }
  if (b.dataset.cal) { const [y,mo]=S.calM.split('-').map(Number), d=new Date(y, mo-1+(+b.dataset.cal), 1); S.calM=d.getFullYear()+'-'+p2(d.getMonth()+1); S.calSel=null; renderCurrent(true); return; }
  if (b.dataset.cday) { const k=b.dataset.cday, n=filtered(curModel(),true).filter(t=>iso(t.d)===k).length;
    if (n===1) { calPick(k, false); const t=filtered(curModel(),true).find(t=>iso(t.d)===k); openForm(t.row); return; }   // un solo trade: si apre subito
    calPick(S.calSel===k ? null : k, true); return; }   // più trade: la card entra e la pagina scende fino all'elenco
  if (b.closest('[data-seg="pcfg-view"]')) { CFG.prop.view=b.dataset.v; setSeg(b.closest('[data-seg]'),b.dataset.v); propChanged(); return; }
  if (b.dataset.act==='nacc') { CFG.prop.n=Math.min(50, Math.max(1, nAcc()+(+b.dataset.d))); propChanged(true); return; }
  if (b.dataset.act==='cfgapply') { S.filtBy={ EOW:FILT_DEF('EOW'), Journal:FILT_DEF('Journal') }; S.filt=S.filtBy[S.file]; saveFilt(); toast('Filtri aggiornati'); return; }
  if (b.dataset.act==='cacheclear') { Object.keys(localStorage).filter(k=>/^tj\.(data\.|news)/.test(k)).forEach(k=>localStorage.removeItem(k)); toast('Dati salvati cancellati: ricarico'); setTimeout(()=>location.reload(), 900); return; }
  { const sgc=b.closest('[data-seg]');
    if (sgc && sgc.dataset.seg.indexOf('cfg-')===0) { const k=sgc.dataset.seg.slice(4); CFG[k]=b.dataset.v; setSeg(sgc,b.dataset.v); cfgChanged(k); return; }
    const chc=b.closest('[data-chips="cfg-idea"]');
    if (chc) { b.classList.toggle('on'); CFG.exIdea=L.idea.filter(i=>!chc.querySelector('[data-v="'+i+'"]').classList.contains('on')); saveCfg(); return; } }
  if (b.id==='fab' || b.dataset.act==='new') { if (NOFILE.includes(S.tab)) openNewPick(); else openForm(); return; }
  if (b.dataset.newf) { switchFile(b.dataset.newf); openForm(); return; }
  if (b.dataset.open) { const [f,row]=b.dataset.open.split(':'); if (!(+row>1)) { toast('Il trade si sta ancora salvando: riprova tra un attimo'); return; } switchFile(f); openForm(+row); return; }
  if (b.dataset.bd) { openBd(b); return; }
  if (b.dataset.act==='nsai') { askNewsAI(b); return; }
  if (b.dataset.act==='trretry') { trTry=0; trErr=''; loadTrump(true).catch(()=>{}); renderCurrent(true); return; }
  if (b.dataset.nday) { const el=$('nd-'+b.dataset.nday); if (!el) { toast('Nessuna news di impatto medio o alto quel giorno'); return; } const d=el.closest('details'); if (d) d.open=true;
    const y=el.getBoundingClientRect().top+scrollY-(innerWidth<1000?78:16); window.scrollTo({ top:y, behavior:reduceMotion()?'auto':'smooth' }); return; }
  if (b.id==='sh-close' || b.dataset.act==='close') { closeSheet(); return; }
  if (b.closest('[data-seg=coach-scope]')) { S.coachScope=b.dataset.v; try { sessionStorage.setItem('tj.cscope', S.coachScope); } catch(e) {} renderCoach(); return; }
  if (b.dataset.q) { sendChat(b.dataset.q); return; }
  if (b.dataset.act==='chatclear') { S.chat=[]; saveChat(); renderChat(); return; }
  if (b.id==='aifab') { openChat(); return; }
  if (b.dataset.tabGo) { go(b.dataset.tabGo); return; }
  if (b.dataset.act==='del') { delClick(b); return; }
  if (b.closest('#sh-body')) { if (S.sheet==='form') formClick(b); else if (S.sheet==='filt') filtClick(b); return; }
  if (b.dataset.act==='save') { save(); return; }
  if (b.dataset.act==='freset') { S.filt=FILT_DEF(S.file); saveFilt(); renderFilters(); renderCurrent(true); return; }
  if (b.dataset.rm) { removeFilter(b.dataset.rm); return; }
  if (b.dataset.act==='mc') { go('mc'); return; }
  if (b.dataset.act==='claude') { askClaude(); return; }
  if (b.dataset.act==='mcrun') { runMCClick(); return; }
  if (b.dataset.act==='setup') { showSetup(); return; }
  if (b.dataset.act==='filters') { openFilters(); return; }
  if (b.dataset.act==='more') { S.lmore+=60; renderList(); return; }
  if (b.classList.contains('trow')) { if (b.dataset.row) openForm(+b.dataset.row); return; }
  const sg=b.closest('[data-seg]');
  if (b.closest('[data-seg=dper]')) { S.dper=b.dataset.v; store.set('dper',S.dper); renderCurrent(true); return; }
  if (b.closest('[data-seg=per]')) { setPer(b.dataset.v); renderCurrent(true); return; }
  if (sg && sg.dataset.seg.indexOf('pf-')===0) { const k=sg.dataset.seg.slice(3); S.pf[k]=b.dataset.v; savePF(); if (k==='size'||k==='goal') renderCurrent(true); else setSeg(sg,b.dataset.v); return; }
  if (b.dataset.act==='pfai') { openChat(); sendChat('Commenta il piano che Simula mi consiglia per passare le valutazioni: è sensato per come trado? Cosa cambieresti e perché?'); return; }
  if (b.closest('[data-lf]')) { S[b.dataset.k]=b.dataset.v; S.lmore=60; renderList(); return; }
});
$('sh-body').addEventListener('input', e => {
  const k=e.target.dataset.k, fk=e.target.dataset.fk;

});

  CFG[c] = c==='check' ? e.target.value.split('\n').map(x=>x.trim()).filter(Boolean) : e.target.value; cfgChanged(c); toast('Impostazione salvata'); });

  if (ds.pcfg) { CFG.prop[ds.pcfg]=t.value.trim(); propChanged(); toast('Impostazione salvata'); return; }
});
document.addEventListener('change', e => { const k=e.target.dataset && e.target.dataset.hp; if (!k) return;

$('sh-body').addEventListener('focusout', e => { const k=e.target.dataset.k; if (k && S.sheet==='form' && !S.touched[k]) { S.touched[k]=true; refresh(); } });
$('scrim').addEventListener('click', closeSheet);
// scorciatoie (PC): 1–9 pagine della barra laterale, N nuovo trade, F filtri, ⌘K / Ctrl+K palette comandi
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && (e.key==='k' || e.key==='K')) { e.preventDefault(); palToggle(); return; }
  if (PAL.on) return;
  if (e.metaKey || e.ctrlKey || e.altKey || S.sheet || ($('lb') && $('lb').classList.contains('on')) || /INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')) return;
  const items=[...NAV.filter(n=>!n.g), ...NAV_FOOT];
  if (/^[1-9]$/.test(e.key) && items[+e.key-1]) { e.preventDefault(); navTo(navKey(items[+e.key-1]), { instant:true }); }
  else if (e.key==='n' || e.key==='N') { e.preventDefault(); $('fab').click(); }
  else if ((e.key==='f' || e.key==='F') && !NOFILE.includes(S.tab)) { e.preventDefault(); openFilters(); }
});
document.addEventListener('keydown', e => { const lb=$('lb'), on=lb && lb.classList.contains('on');
  if (on) { if (e.key==='Escape') lbClose(); else if (e.key==='ArrowRight') lbShow(LB.i+1); else if (e.key==='ArrowLeft') lbShow(LB.i-1); return; }
  if (e.key==='Escape' && S.sheet) closeSheet(); });
let lastY=0;

  if (Math.abs(y-lastY)>6) { const dn=y>lastY && y>120; $('fab').classList.toggle('mini', dn); $('aifab').classList.toggle('away', dn); lastY=y; } }, { passive:true });
let lastW=window.innerWidth, rT;
window.addEventListener('resize', () => { clearTimeout(rT); rT=setTimeout(()=>{ if (Math.abs(window.innerWidth-lastW)>20) { lastW=window.innerWidth; if (!S.sheet) renderCurrent(true); } }, 200); });

S.filtBy=loadFilt(); S.filt=S.filtBy[S.file]; S.pf=loadPF();
try { S.cust=JSON.parse(store.get('cust','{}'))||{}; } catch(e) { S.cust={}; }

  const sp=$('splash'); let seen=false; try { seen=sessionStorage.getItem('tj.hi')==='1'; sessionStorage.setItem('tj.hi','1'); } catch(e) {}

$('setupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const url=$('su-url').value.trim(), key=$('su-key').value.trim(), err=$('su-err'), b=$('su-go');

  if (key.length<20) { err.innerHTML=ic('alert',15,2)+'<span>La chiave sembra incompleta: copiala tutta dal log.</span>'; return; }
  store.set('api',url); store.set('key',key); err.innerHTML=''; b.disabled=true; b.innerHTML='<span class="spin"></span>Controllo…';
  try { await call('getTrades', S.file); $('setup').hidden=true; S.data={}; load(); }
  catch(x) { if ($('setup').hidden) showSetup(); $('su-err').innerHTML=ic('alert',15,2)+'<span>'+esc(x.message==='Chiave non valida'?'La chiave non è valida: controllala e riprova.':x.message==='NETWORK'?'Lo script non risponde: apri l\'URL nel browser e controlla che il deployment sia «Chiunque» con il Code.gs nuovo.':'Non riesco a collegarmi: '+x.message)+'</span>'; }

{ const b0=Math.max(0,(S.introAt||0)-performance.now()); document.documentElement.style.setProperty('--boot0', Math.round(b0)+'ms'); document.documentElement.classList.add('boot'); setTimeout(()=>document.documentElement.classList.remove('boot'), b0+1600); }
renderChrome();

setTimeout(checkUpdate, 4000); setTimeout(pullSettings, 1500);
