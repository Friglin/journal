<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edgebook</title>
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Edgebook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css?v=2026-10-29.1">
</head>
<body>
<a class="skip" href="#main">Vai al contenuto</a>
<aside class="side" id="side" aria-label="Pagine"></aside>
<header class="top" id="top">
  <div class="wrap">
    <div class="brand" id="brand"></div>
    <div class="ptitle" id="ptitle"></div>
    <div class="seg file sm" id="fileSeg" style="--n:2;--i:0"><button type="button" data-v="EOW" class="on">EOW</button><button type="button" data-v="Journal">Journal</button></div>
  </div>
  <div class="wrap filebar" id="filebar"></div>
</header>
<main class="wrap" id="main" tabindex="-1">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-news" hidden></section>
  <section class="view" id="v-list" hidden></section>
  <section class="view" id="v-stats" hidden></section>
  <section class="view" id="v-cal" hidden></section>
  <section class="view" id="v-mc" hidden></section>
  <section class="view" id="v-disc" hidden></section>
  <section class="view" id="v-coach" hidden></section>
  <section class="view" id="v-set" hidden></section>
</main>
<button class="fab" id="fab" type="button"></button>
<button class="aifab" id="aifab" type="button" aria-label="Chiedi al coach"></button>
<nav class="bar" id="nav"><div class="in"></div></nav>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
  <div class="grab"></div>
  <div class="sheet-h"><div><div class="eyebrow" id="sh-sub"></div><h2 id="sh-title"></h2></div><button class="icon-btn" id="sh-close" type="button" aria-label="Chiudi"></button></div>
  <div class="sheet-b" id="sh-body"></div>
  <div class="sheet-f" id="sh-foot"></div>
</section>
<div class="toast" id="toast" role="status"></div>
<div id="setup" hidden><form class="setup-in" id="setupForm" autocomplete="off">
  <div id="setupLogo"></div><h1>Collega i tuoi fogli</h1>
  <p>Serve una volta sola su questo dispositivo. Trovi i due dati nel progetto Apps Script.</p>
  <div class="field"><label for="su-url">Indirizzo dell'app web (finisce con /exec)</label><input class="inp" id="su-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" required></div>
  <div class="field"><label for="su-key">Chiave di accesso</label><input class="inp" id="su-key" type="password" placeholder="La trovi nel log di impostaChiave" required></div>
  <div class="ferr" id="su-err"></div>
  <button class="btn" type="submit" id="su-go">Collega</button>
</form></div>
<div id="splash" aria-hidden="true"></div>

<script>
// versione dell'app: cambia a ogni pubblicazione con tools/build.py, che la scrive qui, nei ?v= e in ogni file.
// Se online c'è una versione più nuova, l'app si aggiorna da sola (checkUpdate in core.js legge questa riga).
const BUILD = '2026-10-29.1';
// ogni file JS, se è stato letto tutto, si segna in EB_V con la sua versione; app.css la scrive in --eb-build
const EB_V = {}, EB_FILES = ['core.js', 'home.js', 'pagine.js', 'analisi.js', 'simula.js', 'scheda.js'];
// avvio: parte solo se tutti i file sono della stessa versione. Se no (copia vecchia in cache, file mancante) li
// riscarica una volta e ricarica la pagina; se il problema resta avvisa e prova comunque ad avviare.
function ebStart() {
  const css = getComputedStyle(document.documentElement).getPropertyValue('--eb-build').trim().replace(/["']/g, '');
  const bad = EB_FILES.filter(f => EB_V[f] !== BUILD).concat(css === BUILD ? [] : ['app.css']);
  if (!bad.length && typeof boot === 'function') { boot(); return; }
  let tried = ''; try { tried = sessionStorage.getItem('tj.vfix') || ''; sessionStorage.setItem('tj.vfix', BUILD); } catch (e) {}
  if (tried !== BUILD) {
    Promise.all(bad.map(f => fetch(f + '?v=' + encodeURIComponent(BUILD), { cache: 'reload' }).catch(() => {}))).then(() => location.reload());
    return;
  }
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:99;padding:14px 16px;border-radius:14px;background:#B3261E;color:#fff;font:600 14px/1.4 system-ui,sans-serif';
  box.textContent = 'L\'app non si è caricata del tutto (' + bad.join(', ') + '). Controlla la connessione e ricarica la pagina.';
  document.body.appendChild(box);
  if (typeof boot === 'function') boot();
}
</script>
<script src="core.js?v=2026-10-29.1"></script>
<script src="home.js?v=2026-10-29.1"></script>
<script src="pagine.js?v=2026-10-29.1"></script>
<script src="analisi.js?v=2026-10-29.1"></script>
<script src="simula.js?v=2026-10-29.1"></script>
<script src="scheda.js?v=2026-10-29.1"></script>
<script>ebStart();</script>
</body>
</html>
