<!DOCTYPE html>
<html lang="it">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Journal</title>
<meta name="theme-color" content="#3452F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Journal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap">
<style>
/* Layout: app a una colonna per telefono – header con cambio file, viste Home / Trade / Analisi, scheda a comparsa per inserire */
/* Palette: inchiostro blu notte e cobalto, verde/rosso solo per vinti e persi. Titoli e numeri in Sora, testo in Geist. */
:root {
  --bg:#EDF0F6; --surface:#FFFFFF; --sunk:#E3E8F1; --line:#D7DEEA; --fg:#0C1424; --fg2:#4A5468; --fg3:#848EA3;
  --accent:#3452F0; --accent-ink:#FFFFFF; --accent-soft:#E1E7FE; --glow2:#12B5CB;
  --win:#0F8F57; --win-soft:#DAF2E6; --loss:#DC3B32; --loss-soft:#FCE2DF; --warn:#9A5800; --warn-soft:#FCEFD2;
  --shadow:0 1px 2px rgba(12,20,36,.05), 0 14px 32px -18px rgba(12,20,36,.28);
  --scrim:rgba(8,12,24,.42);
  --display:'Sora','Avenir Next','Segoe UI',system-ui,sans-serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#070B15; --surface:#0F1626; --sunk:#172036; --line:#212C45; --fg:#E8EDF7; --fg2:#A2ADC3; --fg3:#6C788F;
  --accent:#6F87FF; --accent-ink:#FFFFFF; --accent-soft:#1A2552; --glow2:#22D3EE;
  --win:#34D399; --win-soft:#0E2C22; --loss:#F87171; --loss-soft:#3A1616; --warn:#FBBF24; --warn-soft:#382A0A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 36px -18px rgba(0,0,0,.8); --scrim:rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#070B15; --surface:#0F1626; --sunk:#172036; --line:#212C45; --fg:#E8EDF7; --fg2:#A2ADC3; --fg3:#6C788F;
  --accent:#6F87FF; --accent-ink:#FFFFFF; --accent-soft:#1A2552; --glow2:#22D3EE;
  --win:#34D399; --win-soft:#0E2C22; --loss:#F87171; --loss-soft:#3A1616; --warn:#FBBF24; --warn-soft:#382A0A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 36px -18px rgba(0,0,0,.8); --scrim:rgba(0,0,0,.6); color-scheme:dark; }

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { background:var(--bg); }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 var(--sans); -webkit-font-smoothing:antialiased; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:25; background:var(--bg); }
button { font:inherit; color:inherit; cursor:pointer; }
[hidden] { display:none !important; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.num, .v, .big, td { font-variant-numeric:tabular-nums; }
.wrap { max-width:720px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
.ic { flex:none; display:block; }
.pos { color:var(--win); } .neg { color:var(--loss); } .mut { color:var(--fg3); }
.eyebrow { font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg3); font-weight:600; }
.h2 { font-family:var(--display); font-size:20px; font-weight:500; letter-spacing:-.01em; margin:0; text-wrap:balance; }

/* header */
header.top { position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid transparent; transition:border-color .25s; }
header.top.scrolled { border-bottom-color:var(--line); }
.top .wrap { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:12px; }
.brand { display:flex; align-items:center; gap:9px; font-family:var(--display); font-size:21px; font-weight:500; letter-spacing:-.015em; }
.quiet .rise, .quiet .line, .quiet .area, .quiet .endpt, .quiet .bar, .quiet .track i, .quiet .ring .fgc, .quiet .dots i { animation:none; }
.trow.pend { opacity:.55; pointer-events:none; }
@keyframes spin { to { transform:rotate(360deg); } }

/* segmented */
.seg { position:relative; display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); background:var(--sunk); border-radius:12px; padding:3px; }
.seg::before { content:""; position:absolute; top:3px; bottom:3px; left:3px; width:calc((100% - 6px) / var(--n)); border-radius:9px; background:var(--surface);
  box-shadow:0 1px 2px rgba(0,0,0,.08), 0 2px 6px -2px rgba(0,0,0,.12); transform:translateX(calc(var(--i) * 100%)); transition:transform .38s cubic-bezier(.3,1.25,.45,1), opacity .2s; }
.seg.none::before { opacity:0; }
.seg button { position:relative; z-index:1; border:0; background:none; padding:9px 4px; border-radius:9px; font-size:14px; font-weight:500; color:var(--fg2); transition:color .25s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seg button.on { color:var(--fg); font-weight:600; }
.seg.sm button { padding:6px 4px; font-size:13px; }
.seg.file { width:172px; }
.seg button .ic { display:inline-block; vertical-align:-3px; margin-right:4px; }

/* viste */
main { padding-bottom:calc(150px + env(safe-area-inset-bottom,0px)); }
.view { display:flex; flex-direction:column; gap:14px; padding-top:6px; }
.view-in { animation:viewIn .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes viewIn { from { opacity:0; transform:translateY(10px); } }
.rise { animation:rise .65s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--d,0ms); }
@keyframes rise { from { opacity:0; transform:translateY(14px); } }
.card { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; min-width:0; }
.card-h { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
.card-h .sub { font-size:12.5px; color:var(--fg3); }
.link { border:0; background:none; color:var(--accent); font-weight:600; font-size:13.5px; padding:4px 0; display:inline-flex; align-items:center; gap:2px; }

/* home */
.hello { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-top:6px; }
.hello h1 { font-family:var(--display); font-weight:400; font-size:32px; line-height:1.1; letter-spacing:-.025em; margin:4px 0 0; }
.sess { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:500; color:var(--fg2); background:var(--surface); border:1px solid var(--line); padding:5px 10px 5px 9px; border-radius:99px; }
.sess i { width:7px; height:7px; border-radius:50%; background:var(--fg3); }
.sess.open i { background:var(--win); box-shadow:0 0 0 0 color-mix(in srgb,var(--win) 60%,transparent); animation:pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow:0 0 0 7px transparent; } 100% { box-shadow:0 0 0 0 transparent; } }
.hero { position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:18px 18px 0; box-shadow:var(--shadow); }
.hero-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.big { font-family:var(--display); font-size:54px; line-height:1; letter-spacing:-.035em; font-weight:400; margin-top:10px; }
.big small { font-size:22px; color:var(--fg3); letter-spacing:0; margin-left:6px; }
.hero-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; font-size:13px; color:var(--fg2); }
.delta { display:inline-flex; align-items:center; gap:3px; font-size:12.5px; font-weight:600; padding:3px 8px 3px 6px; border-radius:99px; }
.delta.up { background:var(--win-soft); color:var(--win); } .delta.down { background:var(--loss-soft); color:var(--loss); } .delta.flat { background:var(--sunk); color:var(--fg2); }
.spark { position:relative; height:104px; margin:6px -18px 0; }
.kgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
@media (min-width:600px) { .kgrid.k3 { grid-template-columns:repeat(3,minmax(0,1fr)); } }
.kpi { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:4px; min-width:0; }
.kpi .v { font-family:var(--display); font-size:29px; line-height:1.1; letter-spacing:-.02em; display:flex; align-items:center; gap:8px; }
.kpi .v small { font-size:15px; color:var(--fg3); }
.kpi .h { font-size:12.5px; color:var(--fg2); line-height:1.35; }
.ring { width:34px; height:34px; transform:rotate(-90deg); flex:none; }
.ring circle { fill:none; stroke-width:4.5; }
.ring .bgc { stroke:var(--sunk); } .ring .fgc { stroke:var(--accent); stroke-linecap:round; animation:ring 1.2s cubic-bezier(.3,.8,.3,1) both .15s; }
@keyframes ring { from { stroke-dashoffset:94.25; } }
.dots { display:flex; gap:6px; align-items:center; }
.dots i { width:14px; height:14px; border-radius:50%; background:var(--fg3); animation:pop .4s cubic-bezier(.3,1.5,.5,1) both; animation-delay:var(--d); }
.dots i.w { background:var(--win); } .dots i.l { background:var(--loss); } .dots i.b { background:transparent; border:2px solid var(--fg3); }
@keyframes pop { from { transform:scale(0); } }
.ins { display:flex; flex-direction:column; }
.ins-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:11px 0; border-top:1px solid var(--line); }
.ins-row:first-child { border-top:0; padding-top:0; }
.ins-ic { width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); }
.ins-ic.bad { background:var(--loss-soft); color:var(--loss); }
.ins-row b { display:block; font-weight:600; font-size:14.5px; }
.ins-row span { font-size:12.5px; color:var(--fg2); }
.ins-row .r { font-family:var(--display); font-size:18px; }

/* elenco */
.toolbar { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:2px 16px; }
.toolbar::-webkit-scrollbar { display:none; }
.chip { flex:none; border:1px solid var(--line); background:var(--surface); padding:7px 13px; border-radius:99px; font-size:13.5px; font-weight:500; color:var(--fg2); transition:background .2s,color .2s,border-color .2s,transform .15s; }
.chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
.chip:active, .btn:active, .trow:active, .fab:active { transform:scale(.97); }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.dayh { display:flex; justify-content:space-between; align-items:baseline; padding:6px 4px 6px; font-size:13px; font-weight:600; color:var(--fg2); }
.dayh .num { font-family:var(--display); font-size:15px; font-weight:500; }
.dayc { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:0 14px; }
.trow { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:12px 0; transition:transform .15s; }
.trow:first-child { border-top:0; }
.badge { position:relative; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-weight:700; font-size:12px; letter-spacing:.03em; background:var(--sunk); color:var(--fg2); }
.badge::after { content:""; position:absolute; right:-3px; top:-3px; width:11px; height:11px; border-radius:50%; border:2.5px solid var(--surface); background:var(--fg3); }
.badge.w::after { background:var(--win); } .badge.l::after { background:var(--loss); }
.t1 { font-weight:600; font-size:14.5px; display:flex; gap:8px; align-items:baseline; }
.t1 span { font-weight:400; color:var(--fg3); font-size:13px; }
.t2 { font-size:12.5px; color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tres { text-align:right; }
.tres b { display:block; font-family:var(--display); font-size:17px; font-weight:500; }
.tres span { font-size:11.5px; color:var(--fg3); }
.trow > .ic { color:var(--fg3); }
.more { align-self:center; }

/* analisi */
.stat-h { display:flex; justify-content:space-between; align-items:center; gap:10px; padding-top:6px; }
.stat-h h1 { font-family:var(--display); font-weight:400; font-size:30px; letter-spacing:-.025em; margin:0; }
.fbtn { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:8px 14px; font-weight:600; font-size:13.5px; }
.fbtn em { font-style:normal; background:var(--accent); color:var(--accent-ink); border-radius:99px; min-width:20px; height:20px; display:grid; place-items:center; font-size:11.5px; padding:0 6px; }
.active-f { display:flex; flex-wrap:wrap; gap:6px; }
.active-f span { font-size:12px; background:var(--accent-soft); color:var(--accent); padding:4px 9px; border-radius:99px; font-weight:600; }
.ctrl { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:8px; }
.ctrl .lbl { font-size:11.5px; color:var(--fg3); margin:0 0 5px 2px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
.chart { position:relative; }
.chart svg { display:block; overflow:visible; }
.grid { stroke:var(--line); stroke-width:1; }
.grid.zero { stroke:var(--fg3); stroke-opacity:.6; }
.tick { fill:var(--fg3); font-size:10.5px; font-family:var(--sans); }
.line { fill:none; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; stroke-dasharray:1 1; animation:draw 1.3s cubic-bezier(.45,0,.2,1) both; }
@keyframes draw { from { stroke-dashoffset:1; } }
.area { animation:fade 1s .5s both; }
@keyframes fade { from { opacity:0; } }
.endpt { fill:var(--accent); stroke:var(--surface); stroke-width:2.5; animation:pop .45s 1.2s cubic-bezier(.3,1.6,.5,1) both; transform-box:fill-box; transform-origin:center; }
.xh line { stroke:var(--fg3); stroke-dasharray:3 3; } .xh circle { fill:var(--accent); stroke:var(--surface); stroke-width:2.5; }
.bar { transform-box:fill-box; animation:barIn .7s cubic-bezier(.2,.8,.2,1) both; transition:opacity .2s; }
.bar.p { fill:var(--win); transform-origin:50% 100%; } .bar.n { fill:var(--loss); transform-origin:50% 0; }
.bar.dim { opacity:.35; }
@keyframes barIn { from { transform:scaleY(0); } }
.tip { position:absolute; top:0; left:0; pointer-events:none; background:var(--fg); color:var(--bg); font-size:12px; line-height:1.3; padding:7px 10px; border-radius:10px; white-space:nowrap; opacity:0; transform:translate(-50%,-110%); transition:opacity .15s; z-index:2; }
.tip.show { opacity:1; }
.tip b { display:block; font-size:14px; font-family:var(--display); font-weight:500; }
.bd { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 42px 58px; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:13.5px; }
.bd.hd { border-top:0; padding:0 0 4px; font-size:11px; color:var(--fg3); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
.bd-l { min-width:0; } .bd-l span { display:block; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .bd-l small { color:var(--fg3); font-size:11.5px; }
.track { height:8px; border-radius:99px; background:var(--sunk); overflow:hidden; }
.track i { display:block; height:100%; border-radius:99px; background:var(--accent); transform-origin:left; animation:grow .9s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--d,0ms); }
@keyframes grow { from { transform:scaleX(0); } }
.bd .p2, .bd .r { text-align:right; } .bd .r { font-family:var(--display); font-size:15px; }
.tbl-wrap { overflow-x:auto; margin:0 -4px; }
table { width:100%; border-collapse:separate; border-spacing:3px; font-size:12.5px; }
th { color:var(--fg3); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:4px; text-align:center; }
td { padding:8px 4px; text-align:center; border-radius:8px; }
td:first-child, th:first-child { text-align:left; font-weight:600; color:var(--fg2); }
td.hm { background:color-mix(in oklab, var(--win) var(--p), var(--sunk)); }
td small { display:block; color:var(--fg2); font-size:10.5px; }
.empty { text-align:center; padding:34px 20px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.empty .h2 { font-size:19px; }
.empty p { margin:0; color:var(--fg2); font-size:14px; max-width:30ch; }
.skel { border-radius:18px; background:linear-gradient(100deg,var(--sunk) 30%,color-mix(in srgb,var(--sunk) 50%,var(--surface)) 50%,var(--sunk) 70%); background-size:300% 100%; animation:shim 1.4s linear infinite; }
@keyframes shim { from { background-position:100% 0; } to { background-position:0 0; } }

/* nav e pulsante nuovo */
nav.bar { position:fixed; left:0; right:0; bottom:0; z-index:30; background:color-mix(in srgb,var(--surface) 92%,transparent); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:max(8px,env(safe-area-inset-left,0px)); padding-right:max(8px,env(safe-area-inset-right,0px)); }
nav.bar .in { position:relative; display:grid; grid-template-columns:repeat(4,1fr); max-width:560px; margin:0 auto; }
nav.bar button { background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0 9px; font-size:11.5px; font-weight:600; color:var(--fg3); transition:color .25s; }
nav.bar .pill { display:grid; place-items:center; width:58px; height:30px; border-radius:99px; transition:background .3s, color .3s; }
nav.bar button { position:relative; z-index:1; }
nav.bar button.on { color:var(--fg); } nav.bar button.on .pill { color:var(--accent); }
.ind { position:absolute; top:8px; width:58px; height:30px; border-radius:99px; background:var(--accent-soft); left:calc(100% / 4 * var(--i,0) + 100% / 8 - 29px); transition:left .5s cubic-bezier(.3,1.3,.45,1); }
.fab { position:fixed; z-index:31; transition:padding .35s, gap .35s, transform .2s, opacity .25s; right:max(16px,calc(env(safe-area-inset-right,0px) + 16px)); bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
  display:flex; align-items:center; gap:8px; height:54px; padding:0 22px 0 17px; border:0; border-radius:18px; background:var(--accent); color:var(--accent-ink);
  font-weight:600; font-size:15px; box-shadow:0 12px 26px -10px color-mix(in srgb,var(--accent) 75%,transparent); transition:transform .2s, opacity .25s; }
.fab.hide { opacity:0; transform:scale(.8); pointer-events:none; }

/* scheda */
.scrim { position:fixed; inset:0; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .35s; z-index:40; }
.scrim.open { opacity:1; pointer-events:auto; }
.sheet { position:fixed; left:0; right:0; bottom:0; top:calc(env(safe-area-inset-top,0px) + 12px); z-index:41; max-width:720px; margin:0 auto; background:var(--bg);
  border-radius:26px 26px 0 0; display:flex; flex-direction:column; transform:translateY(103%); transition:transform .5s cubic-bezier(.2,.9,.15,1); box-shadow:0 -24px 50px -24px rgba(0,0,0,.4); }
.sheet.open { transform:none; }
.grab { width:40px; height:5px; border-radius:9px; background:var(--line); margin:8px auto 0; flex:none; }
.sheet-h { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px)); flex:none; }
.sheet-h h2 { font-family:var(--display); font-weight:400; font-size:26px; letter-spacing:-.02em; margin:2px 0 0; }
.icon-btn { width:38px; height:38px; border-radius:50%; border:0; background:var(--sunk); display:grid; place-items:center; color:var(--fg2); flex:none; }
.sheet-b { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:2px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:12px; }
.sheet-f { flex:none; border-top:1px solid var(--line); background:var(--surface); display:flex; align-items:center; gap:12px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)); }
.fsec { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; display:flex; flex-direction:column; gap:14px; }
.fsec-h { display:flex; justify-content:space-between; align-items:center; gap:10px; }

<script>

  const errs=mcErrors(); document.querySelectorAll('#v-mc [data-f]').forEach(w=>{ const k=w.dataset.f.slice(3), m=errs[k]; w.classList.toggle('bad',!!m); const e=w.querySelector('.ferr'); if (e) e.innerHTML=m?ic('alert',15,2)+'<span>'+esc(m)+'</span>':''; });

function simulate(Rs, p) {
  const N=p.n, M=p.sims, K=Rs.length, W=N+1, eq=new Float64Array(M*W), fin=new Float64Array(M), ddP=new Float64Array(M), ddU=new Float64Array(M), stk=new Int32Array(M);
  let ruined=0, prof=0, ruinT=[];
  for (let s=0;s<M;s++) {
    let e=p.cap, pk=e, mdd=0, mddp=0, st=0, mst=0, hit=false; eq[s*W]=e;
    for (let t=0;t<N;t++) {
      const r=Rs[(Math.random()*K)|0], risk = p.mode==='pct' ? Math.max(0,e)*p.risk/100 : p.risk;
      e += risk*r - p.comm; if (e>pk) pk=e;
      const d=pk-e, dp = pk>0 ? d/pk : 1; if (d>mdd) mdd=d; if (dp>mddp) mddp=dp;
      if (r<0) { st++; if (st>mst) mst=st; } else st=0;
      if (!hit && dp*100>=p.ruin) { hit=true; ruinT.push(t+1); }
      eq[s*W+t+1]=e;
    }
    fin[s]=e; ddP[s]=mddp; ddU[s]=mdd; stk[s]=mst; if (hit) ruined++; if (e>p.cap) prof++;
  }
  const q=(arr,p)=>{ const a=Float64Array.from(arr).sort(); return a[Math.min(a.length-1, Math.max(0, Math.round(p*(a.length-1))))]; };
  // percentili della curva (al massimo ~160 punti per il grafico)
  const step=Math.max(1, Math.ceil(N/160)), band=[], col=new Float64Array(M);
  for (let t=0;t<=N;t+=step) { for (let s=0;s<M;s++) col[s]=eq[s*W+t]; col.sort(); const g=x=>col[Math.round(x*(M-1))];
    band.push({ t, p5:g(.05), p25:g(.25), p50:g(.5), p75:g(.75), p95:g(.95) }); if (t+step>N && t!==N) t=N-step; }
  const paths=[]; for (let k=0;k<Math.min(24,M);k++) { const s=Math.floor(k*M/Math.min(24,M)), pts=[]; for (let t=0;t<=N;t+=step) pts.push(eq[s*W+Math.min(t,N)]); if (pts.length<band.length) pts.push(eq[s*W+N]); paths.push(pts); }
  return { p, band, paths, fin:Array.from(fin), q50:q(fin,.5), q5:q(fin,.05), q95:q(fin,.95), mean:fin.reduce((x,y)=>x+y,0)/M, prof:prof/M, ruin:ruined/M,
    dd50:q(ddP,.5), dd95:q(ddP,.95), ddU50:q(ddU,.5), ddU95:q(ddU,.95), st50:q(stk,.5), st95:q(stk,.95), ruinT: ruinT.length ? q(ruinT,.5) : NaN, K:Rs.length,
    expR: Rs.reduce((x,y)=>x+y,0)/Rs.length };
}

function fanChart(el, res) {

  const idx = edit ? S.rows.findIndex(r=>r._row===edit.row) : -1, prev = idx>=0 ? S.rows[idx] : null;
  if (idx>=0) S.rows[idx]=prov; else S.rows.push(prov);
  S.flash=prov; S.flashT=performance.now(); closeSheet(); S.edit=null; S.f={}; renderCurrent(true); setSync(true);
  if (c.out==='Win' && !edit) setTimeout(confetti, 260);
  try {
    const res = edit ? await call('updateTrade', file, edit.row, d, edit.check) : await call('addTrade', file, d);
    const D=S.data[file];
    if (D) { const k=D.rows.findIndex(a=>a[0]===res.row[0]); if (k>=0) D.rows[k]=res.row; else D.rows.push(res.row); cacheSet(file,D); }
    if (S.file===file) { const i2=S.rows.indexOf(prov), obj=D?unpack(D.h,res.row):Object.assign({}, prov, { _row:res.row[0], _pending:false });
      if (i2>=0) S.rows[i2]=obj; if (S.flash===prov) S.flash=obj; if (!S.sheet) renderCurrent(true); }
    toast(edit ? 'Modifiche salvate' : 'Trade salvato in '+file);
  } catch(e) {
    const i2=S.rows.indexOf(prov); if (i2>=0) { if (prev) S.rows[i2]=prev; else S.rows.splice(i2,1); }
    renderCurrent(true);
    if (S.file===file && !S.sheet) { S.sheet='form'; S.f=form; S.edit=edit; $('sh-title').textContent = edit?'Modifica trade':'Nuovo trade'; renderForm(); openSheet(); }
    toast('Non salvato: '+(e.message||e), true);
  } finally { setSync(false); }
}

// ───────────────────────── scheda: apertura e chiusura ─────────────────────────
function openSheet() { $('sheet').classList.add('open'); $('scrim').classList.add('open'); $('fab').classList.add('hide'); document.body.style.overflow='hidden'; $('sh-body').scrollTop=0; }
function closeSheet() { $('sheet').classList.remove('open'); $('scrim').classList.remove('open'); $('fab').classList.toggle('hide', S.tab==='mc'); document.body.style.overflow=''; S.sheet=null; }

// ───────────────────────── eventi ─────────────────────────
document.addEventListener('click', e => {
  const b=e.target.closest('button'); if (!b) return;
  if (b.closest('#nav')) { if (b.dataset.tab) go(b.dataset.tab); return; }
  if (b.closest('#fileSeg')) { const f=b.dataset.v; if (f===S.file) return; setSeg($('fileSeg'),f); S.file=f; S.type=f==='EOW'?'EOW':'JOURNAL'; S.filt={}; S.lmore=60; store.set('file',f); load(); return; }
  if (b.id==='fab' || b.dataset.act==='new') { openForm(); return; }
  if (b.id==='sh-close' || b.dataset.act==='close') { closeSheet(); return; }
  if (b.closest('#sh-body')) { if (S.sheet==='form') formClick(b); else if (S.sheet==='filt') filtClick(b); return; }
  if (b.dataset.act==='save') { save(); return; }
  if (b.dataset.act==='freset') { S.filt={}; saveFilt(); renderFilters(); renderCurrent(true); return; }
  if (b.dataset.rm) { removeFilter(b.dataset.rm); return; }
  if (b.dataset.act==='mc') { go('mc'); return; }
  if (b.dataset.act==='mcrun') { runMCClick(); return; }
  if (b.dataset.act==='setup') { showSetup(); return; }
  if (b.dataset.act==='filters') { openFilters(); return; }
  if (b.dataset.act==='list') { go('list'); return; }
  if (b.dataset.act==='more') { S.lmore+=60; renderList(); return; }
  if (b.classList.contains('trow')) { if (b.dataset.row) openForm(+b.dataset.row); return; }
  const sg=b.closest('[data-seg]');
  if (b.dataset.per) { S.per=b.dataset.per; store.set('per',S.per); renderHome(); return; }
  if (sg && sg.dataset.seg.indexOf('mc-')===0) { const k=sg.dataset.seg==='mc-mode'?'mode':'sims'; S.mc[k]=b.dataset.v; saveMC(); if (k==='mode') renderCurrent(true); else setSeg(sg,b.dataset.v); return; }
  if (b.closest('[data-lf]')) { S[b.dataset.k]=b.dataset.v; S.lmore=60; renderList(); return; }
});
$('sh-body').addEventListener('input', e => {
  const k=e.target.dataset.k, fk=e.target.dataset.fk;
  if (k && S.sheet==='form') { S.f[k]=e.target.value; refresh(); }
  if (fk && S.sheet==='filt') { S.filt[fk]=e.target.value; S.filt.quick=''; saveFilt(); renderCurrent(true); filtFoot(); }
});
document.addEventListener('change', e => { const k=e.target.dataset && e.target.dataset.hp; if (!k) return;
  S.cust[k]=e.target.value; store.set('cust', JSON.stringify(S.cust)); renderHome(); });
document.addEventListener('input', e => { const k=e.target.dataset && e.target.dataset.mc; if (!k) return; S.mc[k]=e.target.value; saveMC();
  const w=e.target.closest('.field'); if (w && w.classList.contains('bad')) { w.classList.remove('bad'); }
  const b=$('mc-run'); if (b && !b.disabled) b.innerHTML=ic('dice',18,2)+'Avvia simulazione'; });
$('sh-body').addEventListener('focusout', e => { const k=e.target.dataset.k; if (k && S.sheet==='form' && !S.touched[k]) { S.touched[k]=true; refresh(); } });
$('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key==='Escape' && S.sheet) closeSheet(); });
let lastY=0;
window.addEventListener('scroll', () => { const y=window.scrollY; $('top').classList.toggle('scrolled', y>4);
  if (Math.abs(y-lastY)>6) { $('fab').classList.toggle('mini', y>lastY && y>120); lastY=y; } }, { passive:true });
let lastW=window.innerWidth, rT;
window.addEventListener('resize', () => { clearTimeout(rT); rT=setTimeout(()=>{ if (Math.abs(window.innerWidth-lastW)>20) { lastW=window.innerWidth; if (!S.sheet) renderCurrent(); } }, 200); });
setInterval(() => { const el=$('sess'); if (el) { const s=sessionInfo(); el.className='sess'+(s.open?' open':''); el.innerHTML='<i></i>'+s.txt; } }, 30000);

S.filt=loadFilt(); S.mc=loadMC();
try { S.cust=JSON.parse(store.get('cust','{}'))||{}; } catch(e) { S.cust={}; }
(function welcome() {
  const sp=$('splash'); let seen=false; try { seen=sessionStorage.getItem('tj.hi')==='1'; sessionStorage.setItem('tj.hi','1'); } catch(e) {}
  if (seen || RM) { sp.remove(); return; }
  sp.innerHTML='<div class="sp-in">'+logo(68)+'<h1>'+words(greeting())+'</h1><p>Preparo i tuoi trade…</p></div>';
  setTimeout(()=>{ sp.classList.add('out'); setTimeout(()=>sp.remove(), 600); }, 1150);
})();
function showSetup(msg) {
  const el=$('setup'); $('setupLogo').innerHTML=logo(52); $('su-url').value=store.get('api',''); $('su-key').value=store.get('key','');
  $('su-err').innerHTML = msg ? ic('alert',15,2)+'<span>'+esc(msg)+'</span>' : ''; el.hidden=false;
}
$('setupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const url=$('su-url').value.trim(), key=$('su-key').value.trim(), err=$('su-err'), b=$('su-go');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) { err.innerHTML=ic('alert',15,2)+'<span>L\'indirizzo deve essere tipo https://script.google.com/macros/s/…/exec</span>'; return; }
  if (key.length<20) { err.innerHTML=ic('alert',15,2)+'<span>La chiave sembra incompleta: copiala tutta dal log.</span>'; return; }
  store.set('api',url); store.set('key',key); err.innerHTML=''; b.disabled=true; b.innerHTML='<span class="spin"></span>Controllo…';
  try { await call('getTrades', S.file); $('setup').hidden=true; S.data={}; load(); }
  catch(x) { if ($('setup').hidden) showSetup(); $('su-err').innerHTML=ic('alert',15,2)+'<span>'+esc(x.message==='Chiave non valida'?'La chiave non è valida: controllala e riprova.':x.message==='NETWORK'?'Lo script non risponde: apri l\'URL nel browser e controlla che il deployment sia «Chiunque» con il Code.gs nuovo.':'Non riesco a collegarmi: '+x.message)+'</span>'; }
  finally { b.disabled=false; b.textContent='Collega'; }
});
renderChrome();
if (!viaScript() && !(store.get('api','') && store.get('key',''))) showSetup(); else load();
</script>
